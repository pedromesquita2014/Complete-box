<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complete Box</title>
<style>
:root {
  --bg: #120e24;
  --card: #1c1738;
  --tx: #f3f0ff;
  --mu: #9b93c4;
  --ac: #7c53ff;
  --ac2: #ff6b35;
  --bd: #2d2654;
  --gold: #ffd700;
  --green: #22c55e;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(1200px 600px at 50% -100px, rgba(124,83,255,0.28), transparent), var(--bg);
  color: var(--tx);
  font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(28,23,56,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bd);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  font-weight: 900;
  font-size: 22px;
  background: linear-gradient(90deg, var(--ac), var(--ac2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -0.5px;
}
.online-badge {
  font-size: 11px;
  background: rgba(34,197,94,0.15);
  color: var(--green);
  border: 1px solid rgba(34,197,94,0.4);
  padding: 3px 8px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
}
.online-dot {
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--green);
}
.coins {
  margin-left: auto;
  font-weight: 800;
  background: rgba(255,215,0,0.1);
  border: 1px solid rgba(255,215,0,0.3);
  color: #ffe66d;
  border-radius: 20px;
  padding: 5px 12px;
  white-space: nowrap;
  font-size: 14px;
}
nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 16px;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: none;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  border-radius: 20px;
  padding: 8px 16px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
nav button:hover { border-color: var(--ac); }
nav button.on {
  background: linear-gradient(120deg, var(--ac), var(--ac2));
  color: #fff;
  border-color: transparent;
  font-weight: 800;
  box-shadow: 0 4px 14px rgba(124,83,255,0.4);
}
main {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 16px 40px;
}
.hero {
  margin: 0 16px 12px;
  padding: 16px;
  border-radius: 16px;
  color: #fff;
  background: linear-gradient(120deg, #7c53ff, #ff6b35);
  font-weight: 700;
  box-shadow: 0 6px 20px rgba(124,83,255,0.3);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 16px;
  margin: 14px 0;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  animation: fadeIn 0.3s ease-out;
}
.rules { font-size: 13px; color: var(--mu); margin-bottom: 8px; }
input, textarea, select {
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: var(--tx);
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 10px 12px;
  margin: 6px 0;
}
input:focus, textarea:focus, select:focus {
  outline: 2px solid var(--ac);
  border-color: transparent;
}
textarea { min-height: 90px; resize: vertical; }
button.p {
  background: linear-gradient(120deg, var(--ac), #a24bff);
  color: #fff;
  border: 0;
  border-radius: 12px;
  padding: 10px 18px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(124,83,255,0.35);
  transition: transform 0.1s, opacity 0.2s;
}
button.p:active { transform: scale(0.96); }
button.s {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--bd);
  color: var(--tx);
  border-radius: 10px;
  padding: 6px 12px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}
button.s:hover { background: rgba(255,255,255,0.1); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.by { font-size: 12px; color: var(--mu); }
.empty { text-align: center; color: var(--mu); padding: 32px 12px; }
iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 12px; background: #000; }
iframe.g { aspect-ratio: 4/3; background: #fff; }
pre { background: var(--bg); border: 1px solid var(--bd); border-radius: 10px; padding: 12px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; color: var(--tx); }
.av {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--ac);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  overflow: hidden;
  flex: none;
  font-size: 16px;
}
#msgs { height: 50vh; overflow-y: auto; border-radius: 14px; padding: 12px; border: 1px solid var(--bd); background: rgba(18,14,36,0.7); }
.m { display: flex; gap: 10px; margin: 10px 0; align-items: flex-start; }
.bub {
  background: var(--card);
  color: var(--tx);
  border-radius: 14px;
  padding: 8px 14px;
  max-width: 82%;
  border: 1px solid var(--bd);
  word-break: break-word;
}
.bub b { font-size: 12px; display: block; margin-bottom: 2px; }
.bub i { font-size: 11px; color: var(--mu); font-style: normal; }
#toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  top: 75px;
  background: linear-gradient(120deg, var(--ac), var(--ac2));
  color: #fff;
  padding: 10px 20px;
  border-radius: 30px;
  font-weight: 700;
  z-index: 99;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { from { transform: translate(-50%, -20px) scale(0.7); opacity: 0; } }
.online-users-list { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0; }
.online-user-tag { background: var(--bg); border: 1px solid var(--bd); border-radius: 16px; padding: 4px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.gift-card { background: linear-gradient(135deg, rgba(255,107,53,0.15), rgba(124,83,255,0.15)); border: 1px solid var(--ac); border-radius: 12px; padding: 12px; margin: 8px 0; }
</style>
</head>
<body>

<header>
  <span class="logo">📦 Complete Box</span>
  <span class="online-badge"><span class="online-dot"></span> Rede Ativa</span>
  <span class="coins" id="coins">🪙 0</span>
</header>

<div class="hero">
  <div>
    🌐 <b>Rede Global Conectada!</b>
    <div style="font-size: 12px; opacity: 0.9; font-weight: normal;">Publique vídeos, jogos, envie presentes e converse em tempo real.</div>
  </div>
</div>

<nav id="nav"></nav>

<main id="app"></main>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAgRafNnzncOP631NU9oJTfyBNf6bIy1pQ",
  authDomain: "complete-box-2.firebaseapp.com",
  projectId: "complete-box-2",
  storageBucket: "complete-box-2.firebasestorage.app",
  messagingSenderId: "1010030427570",
  appId: "1:1010030427570:web:dc9c10130a8b98b0fbf8ab"
};

let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.settings({ experimentalAutoDetectLongPolling: true, merge: true });
} catch(e) { console.warn("Offline", e); }

let uid = localStorage.getItem('cb_uid');
if (!uid) {
  uid = 'u_' + Math.random().toString(36).substring(2, 9);
  localStorage.setItem('cb_uid', uid);
}

const OWNER_KEY = 'cb_is_pedro_owner';
if (location.hash === '#pedromesquita2026' || localStorage.getItem(OWNER_KEY) === 'true') {
  localStorage.setItem(OWNER_KEY, 'true');
}

let isOwner = localStorage.getItem(OWNER_KEY) === 'true';

let myProfile = {
  name: isOwner ? 'Pedro Mesquita (Dono)' : (localStorage.getItem('cb_name') || 'Visitante_' + uid.slice(-4)),
  badge: isOwner ? '👑' : '👤',
  coins: isOwner ? Infinity : (parseInt(localStorage.getItem('cb_coins')) || 0)
};

function saveProfileToGlobal() {
  if (!isOwner) localStorage.setItem('cb_name', myProfile.name);
  if (db) {
    db.collection('profiles').doc(uid).set({
      name: myProfile.name,
      badge: myProfile.badge,
      isOwner: isOwner,
      ts: Date.now()
    }, { merge: true });
  }
}
saveProfileToGlobal();

function toast(msg) {
  document.querySelectorAll('#toast').forEach(x => x.remove());
  const e = document.createElement('div');
  e.id = 'toast';
  e.textContent = msg;
  document.body.append(e);
  setTimeout(() => e.remove(), 3500);
}

let tab = 'videos';
let profiles = {};
let dataList = { videos: [], games: [], news: [], polls: [], chat: [], aiMsgs: [], gifts: [] };
let onlineUsers = [];
let searchQuery = '';

const TABS = [
  ['videos', '🎬 Vídeos'],
  ['games', '🎮 Jogos'],
  ['chat', '💬 Chat Global'],
  ['gifts', '🎁 Presentes'],
  ['speak', '🗣️ Complete Speak'],
  ['ai', '🤖 IA Assistant'],
  ['polls', '📊 Enquetes'],
  ['news', '📰 News'],
  ['shop', '🛍️ Loja'],
  ['me', '👤 Perfil']
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeAgo = ts => {
  if (!ts) return 'agora';
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 60) return 'agora';
  if (sec < 3600) return Math.floor(sec/60) + 'm atrás';
  return Math.floor(sec/3600) + 'h atrás';
};

function nav() {
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('');
}

function go(k) { tab = k; searchQuery = ''; nav(); render(); }

function renderHeader() {
  $('#coins').textContent = isOwner ? '🪙 ∞ Complete Coins (Dono)' : `🪙 ${myProfile.coins} Complete Coins`;
}

function setupGlobalSync() {
  if (!db) return;

  db.collection('profiles').onSnapshot(snap => {
    profiles = {}; onlineUsers = [];
    snap.docs.forEach(doc => {
      const d = doc.data(); profiles[doc.id] = d;
      if (d.ts && (Date.now() - d.ts < 300000)) onlineUsers.push({ id: doc.id, name: d.name || 'Usuário', badge: d.badge || '👤' });
    });
    if (tab === 'chat') renderChatUsers();
    if (tab === 'gifts') renderGiftsView();
  });

  ['videos', 'games', 'news', 'polls'].forEach(kind => {
    db.collection(kind).orderBy('ts', 'desc').limit(50).onSnapshot(snap => {
      dataList[kind] = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      if (tab === kind) renderContentList(kind);
    });
  });

  db.collection('global_chat').orderBy('ts', 'asc').limit(100).onSnapshot(snap => {
    dataList.chat = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    if (tab === 'chat') drawMessages();
  });

  db.collection('gifts').orderBy('ts', 'desc').limit(50).onSnapshot(snap => {
    dataList.gifts = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    if (tab === 'gifts') renderGiftsView();
  });
}

setInterval(() => {
  if (db) db.collection('profiles').doc(uid).set({ ts: Date.now() }, { merge: true });
}, 30000);

function render() {
  renderHeader();
  const app = $('#app');

  if (tab === 'chat') { app.innerHTML = chatView(); drawMessages(); renderChatUsers(); return; }
  if (tab === 'gifts') { renderGiftsView(); return; }
  if (tab === 'speak') { app.innerHTML = speakView(); return; }
  if (tab === 'ai') { app.innerHTML = aiView(); drawAIMessages(); return; }
  if (tab === 'me') { app.innerHTML = profileView(); return; }
  if (tab === 'shop') { app.innerHTML = shopView(); return; }

  app.innerHTML = `
    ${postBoxView(tab)}
    <div class="row" style="margin: 12px 0;">
      <input id="sq" placeholder="🔍 Buscar publicações..." value="${esc(searchQuery)}" oninput="searchQuery=this.value; renderContentList('${tab}')">
    </div>
    <div id="content-list"></div>
  `;
  renderContentList(tab);
}

// --- SISTEMA DE PRESENTES ---

function renderGiftsView() {
  const app = $('#app');
  const otherUsers = Object.keys(profiles).filter(id => id !== uid);

  const receivedGifts = (dataList.gifts || []).filter(g => g.to === uid);

  app.innerHTML = `
    <div class="card">
      <b style="font-size: 18px;">🎁 Enviar Presente para Amigos</b>
      <p class="rules">Envie Complete Coins para qualquer amigo registrado na rede!</p>
      
      <label class="rules">Escolha o Amigo:</label>
      <select id="gift-to">
        ${otherUsers.length ? otherUsers.map(id => `<option value="${id}">${esc(profiles[id].badge \vert{}\vert{} '👤')} ${esc(profiles[id].name || 'Usuário')}</option>`).join('') : '<option value="">Sem amigos online no momento</option>'}
      </select>

      <label class="rules">Quantidade de Complete Coins:</label>
      <input id="gift-amount" type="number" min="10" value="50" placeholder="Ex: 50">

      <label class="rules">Mensagem Especial (Opcional):</label>
      <input id="gift-msg" placeholder="Ex: Parabéns pelo post! Tamo junto!">

      <button class="p" style="margin-top: 8px; width:100%;" onclick="sendGift()">🎁 Enviar Presente Agora</button>
    </div>

    <div class="card">
      <b style="font-size: 16px;">📬 Seus Presentes Recebidos:</b>
      <div id="received-gifts-list">
        ${receivedGifts.length ? receivedGifts.map(g => `
          <div class="gift-card">
            <b>🎁 Presente de ${esc(g.fromName)}</b>
            <div style="font-size:16px; color:#ffe66d; margin:4px 0;">🪙 ${g.amount} Complete Coins</div>${g.msg ? `<div style="font-style:italic; font-size:13px; color:var(--mu);">"${esc(g.msg)}"</div>` : ''}
            <div class="by">${timeAgo(g.ts)}</div>
          </div>
        `).join('') : '<div class="empty">Você ainda não recebeu nenhum presente.</div>'}
      </div>
    </div>
  `;
}

async function sendGift() {
  const toId = $('#gift-to').value;
  const amount = parseInt($('#gift-amount').value);
  const msg = $('#gift-msg').value.trim();

  if (!toId) return toast('Escolha um amigo!');
  if (!amount || amount <= 0) return toast('Digite uma quantidade válida!');
  if (!isOwner && myProfile.coins < amount) return toast('Você não tem Complete Coins suficientes!');

  if (!isOwner) {
    myProfile.coins -= amount;
    localStorage.setItem('cb_coins', myProfile.coins);
    renderHeader();
  }

  const giftObj = {
    from: uid,
    fromName: myProfile.name,
    to: toId,
    amount,
    msg,
    ts: Date.now()
  };

  if (db) {
    await db.collection('gifts').add(giftObj);
  }

  toast(`🎁 Presente de 🪙 ${amount} enviado com sucesso!`);
  $('#gift-msg').value = '';
}

// --- COMPLETE SPEAK ---

const SPEAK_PHRASES = [
  { pt: 'Olá', en: 'Hello', es: 'Hola', fr: 'Bonjour' },
  { pt: 'Obrigado', en: 'Thank you', es: 'Gracias', fr: 'Merci' },
  { pt: 'Bom dia', en: 'Good morning', es: 'Buenos días', fr: 'Bonjour' },
  { pt: 'Por favor', en: 'Please', es: 'Por favor', fr: "S'il vous plaît" },
  { pt: 'Como vai?', en: 'How are you?', es: '¿Cómo estás?', fr: 'Comment ça va?' }
];

let currentQuizIndex = 0;

function speakView() {
  const current = SPEAK_PHRASES[currentQuizIndex % SPEAK_PHRASES.length];
  return `
    <div class="card">
      <b style="font-size: 18px;">🗣️ Complete Speak (Aprenda Idiomas)</b>
      <p class="rules">Aprenda frases básicas e ganhe Complete Coins nos Quizzes!</p>
    </div>

    <div class="card">
      <b>📖 Frases Úteis:</b>
      ${SPEAK_PHRASES.map(p => `
        <div style="margin: 8px 0; padding: 8px; background: var(--bg); border-radius: 8px; border: 1px solid var(--bd);">
          <b>🇧🇷 ${p.pt}</b> <br>
          <span style="color:var(--ac);">🇺🇸 ${p.en}</span> | 
          <span style="color:var(--ac2);">🇪🇸 ${p.es}</span> | 
          <span style="color:var(--gold);">🇫🇷 ${p.fr}</span>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <b>🧩 Mini Quiz de Idiomas:</b>
      <p style="margin: 8px 0;">Como se diz <b>"${current.pt}"</b> em Inglês?</p>
      <button class="s" style="display:block; width:100%; margin: 6px 0; padding: 10px;" onclick="checkSpeakQuiz('${current.en}', '${current.en}')">A) ${current.en}</button>
      <button class="s" style="display:block; width:100%; margin: 6px 0; padding: 10px;" onclick="checkSpeakQuiz('Hello World', '${current.en}')">B) Hello World</button>
      <button class="s" style="display:block; width:100%; margin: 6px 0; padding: 10px;" onclick="checkSpeakQuiz('Goodbye', '${current.en}')">C) Goodbye</button>
    </div>
  `;
}

function checkSpeakQuiz(selected, correct) {
  if (selected === correct) {
    toast('✅ Correto! +5 Complete Coins!');
    if (!isOwner) { myProfile.coins += 5; localStorage.setItem('cb_coins', myProfile.coins); renderHeader(); }
  } else {
    toast('❌ Incorreto! Tente a próxima.');
  }
  currentQuizIndex++;
  render();
}

function postBoxView(kind) {
  const titles = { videos: '🎬 Publicar Vídeo Global', games: '🎮 Publicar Jogo HTML Global', news: '📰 Publicar Notícia', polls: '📊 Criar Enquete' };
  return `
    <div class="card">
      <b style="font-size: 16px;">${titles[kind]}</b>
      <p class="rules">Sua publicação ficará visível em tempo real para todos os usuários!</p>
      <input id="p-title" placeholder="Título da publicação" maxlength="100">
      ${kind === 'videos' ? '<input id="p-content" placeholder="Link do YouTube ou URL do vídeo (mp4)">' : ''}
      ${kind === 'games' ? '<textarea id="p-content" placeholder="Cole o código HTML do jogo"></textarea>' : ''}
      ${kind === 'news' ? '<textarea id="p-content" placeholder="Escreva a notícia..."></textarea>' : ''}
      ${kind === 'polls' ? '<input id="p-opt1" placeholder="Opção 1"><input id="p-opt2" placeholder="Opção 2">' : ''}
      <button class="p" style="margin-top: 8px;" onclick="submitPost('${kind}')">🚀 Publicar</button>
    </div>
  `;
}

async function submitPost(kind) {
  const title = $('#p-title').value.trim();
  if (!title) return toast('Insira um título!');

  let content = $('#p-content') ? $('#p-content').value.trim() : '';
  let options = [];

  if (kind === 'polls') {
    options = [$('#p-opt1').value.trim(), $('#p-opt2').value.trim()].filter(Boolean);
    if (options.length < 2) return toast('Insira 2 opções!');
  } else if (!content) {
    return toast('Preencha o conteúdo!');
  }

  const postObj = {
    title, content, options, votes: {}, by: uid,
    authorName: myProfile.name, authorBadge: myProfile.badge,
    ts: Date.now(), likes: []
  };

  if (db) await db.collection(kind).add(postObj);
  toast('🎉 Publicado globalmente!');
  if (!isOwner) { myProfile.coins += 10; localStorage.setItem('cb_coins', myProfile.coins); renderHeader(); }
}

function renderContentList(kind) {
  const container = $('#content-list');
  if (!container) return;

  let items = dataList[kind] || [];
  if (searchQuery) {
    items = items.filter(x => (x.title + ' ' + (x.content || '') + ' ' + (x.authorName || '')).toLowerCase().includes(searchQuery.toLowerCase()));
  }

  if (!items.length) {
    container.innerHTML = '<div class="empty">📭 Nenhuma publicação encontrada.</div>';
    return;
  }

  container.innerHTML = items.map(x => {
    let body = '';
    if (kind === 'videos') {
      const ytMatch = x.content.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
      body = ytMatch ? `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen></iframe>` : `<a href="${esc(x.content)}" target="_blank" style="color:var(--ac)">🔗 ${esc(x.content)}</a>`;
    } else if (kind === 'games') {
      body = `<button class="p" onclick="playGame(this, '${x.id}')">▶ Jogar Jogo</button><div id="game-frame-${x.id}" style="margin-top:10px;"></div>`;
    } else if (kind === 'news') {
      body = `<p style="white-space:pre-wrap;">${esc(x.content)}</p>`;
    } else if (kind === 'polls') {
      const votes = x.votes || {}, totalVotes = Object.keys(votes).length;
      body = (x.options || []).map((opt, idx) => {
        const count = Object.values(votes).filter(v => v === idx).length;
        const pct = totalVotes ? Math.round((count / totalVotes) * 100) : 0;
        return `<button class="s" style="display:block; width:100%; text-align:left; margin:6px 0; padding:10px; position:relative; overflow:hidden;" onclick="votePoll('${x.id}', ${idx})"><span style="position:absolute; left:0; top:0; bottom:0; width:${pct}%; background:var(--ac); opacity:0.25;"></span><span style="position:relative; font-weight:bold;">${esc(opt)} — ${pct}% (${count} votos)</span></button>`;
      }).join('');
    }

    return `
      <div class="card">
        <div class="row" style="margin-bottom:8px;">
          <span class="av">${esc((x.authorName || 'U')[0].toUpperCase())}</span>
          <div>
            <b>${esc(x.authorBadge || '👤')} ${esc(x.authorName || 'Usuário')}</b>
            <div class="by">${timeAgo(x.ts)}</div>
          </div>
        </div>
        <h3 style="margin: 6px 0 10px; font-size:18px;">${esc(x.title)}</h3>
        ${body}
        <div class="row" style="margin-top: 12px; border-top: 1px solid var(--bd); padding-top: 8px;">
          <button class="s" onclick="likeItem('${kind}', '${x.id}')">❤️ ${(x.likes || []).length} Curtidas</button>
          ${(isOwner || x.by === uid) ? `<button class="s" style="color:#ef4444;" onclick="deleteItem('${kind}', '${x.id}')">🗑️ Remover</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function playGame(btn, id) {
  const item = dataList.games.find(g => g.id === id);
  if (!item) return;
  const container = document.getElementById(`game-frame-${id}`);
  if (container) {
    const iframe = document.createElement('iframe');
    iframe.className = 'g'; iframe.srcdoc = item.content;
    container.innerHTML = ''; container.appendChild(iframe); btn.style.display = 'none';
  }
}

async function likeItem(kind, id) {
  const item = dataList[kind].find(x => x.id === id);
  if (!item) return;
  const likes = item.likes || [];
  const updated = likes.includes(uid) ? likes.filter(u => u !== uid) : [...likes, uid];
  if (db) await db.collection(kind).doc(id).update({ likes: updated });
}

async function deleteItem(kind, id) {
  if (db) { await db.collection(kind).doc(id).delete(); toast('Item removido.'); }
}

async function votePoll(id, optIdx) {
  const poll = dataList.polls.find(p => p.id === id);
  if (!poll) return;
  const votes = poll.votes || {}; votes[uid] = optIdx;
  if (db) await db.collection('polls').doc(id).update({ votes });
}

function chatView() {
  return `
    <div class="card">
      <b style="font-size: 16px;">💬 Chat Global Conectado</b>
      <p class="rules">Converse com todos os usuários ativos no site!</p>
      <div class="online-users-list" id="online-users-box"></div>
    </div>
    <div id="msgs"></div>
    <div class="row" style="margin-top:10px;">
      <input id="chat-input" placeholder="Mensagem..." onkeydown="if(event.key==='Enter')sendChatMessage()" style="flex:1;">
      <button class="p" onclick="sendChatMessage()">Enviar 🚀</button>
    </div>
  `;
}

function renderChatUsers() {
  const box = $('#online-users-box');
  if (!box) return;
  box.innerHTML = onlineUsers.map(u => `<div class="online-user-tag"><span class="online-dot"></span> ${esc(u.badge)} ${esc(u.name)}</div>`).join('');
}

function drawMessages() {
  const box = $('#msgs');
  if (!box) return;
  const msgs = dataList.chat || [];
  box.innerHTML = msgs.map(m => `
    <div class="m" style="${m.by === uid ? 'flex-direction:row-reverse;' : ''}">
      <span class="av">${esc((m.authorName || 'U')[0].toUpperCase())}</span>
      <div class="bub" style="${m.by === uid ? 'background:var(--ac); color:#fff;' : ''}">
        <b>${esc(m.authorBadge || '👤')} ${esc(m.authorName || 'Usuário')}</b>
        ${esc(m.text)}
        <br><i>${timeAgo(m.ts)}</i>
      </div>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendChatMessage() {
  const input = $('#chat-input');
  const text = input.value.trim();
  if (!text) return;
  const msgObj = { text, by: uid, authorName: myProfile.name, authorBadge: myProfile.badge, ts: Date.now() };
  input.value = '';
  if (db) await db.collection('global_chat').add(msgObj);
}

function aiView() {
  return `
    <div class="card">
      <b style="font-size: 16px;">🤖 Complete AI & Criador de Jogos</b>
      <p class="rules">Crie jogos HTML instantaneamente com inteligência artificial!</p>
      <input id="ai-game-prompt" placeholder="Ideia de jogo (ex: pular obstáculos)">
      <button class="p" style="margin-top: 6px; width:100%;" onclick="generateAIGame()">⚡ Gerar Jogo com IA</button>
    </div>
    <div id="ai-chat-box" style="height: 35vh; overflow-y: auto; border-radius: 14px; padding: 12px; border: 1px solid var(--bd); background: rgba(18,14,36,0.7);"></div>
    <div class="row" style="margin-top: 10px;">
      <input id="ai-input" placeholder="Pergunte à IA..." onkeydown="if(event.key==='Enter')sendAIMessage()" style="flex:1;">
      <button class="p" onclick="sendAIMessage()">Conversar 🤖</button>
    </div>
  `;
}

function drawAIMessages() {
  const box = $('#ai-chat-box');
  if (!box) return;
  box.innerHTML = dataList.aiMsgs.map(m => `
    <div class="m" style="${m.role === 'user' ? 'flex-direction:row-reverse;' : ''}">
      <span class="av" style="background:${m.role === 'user' ? 'var(--ac)' : 'var(--ac2)'};">${m.role === 'user' ? 'Você' : 'IA'}</span>
      <div class="bub" style="${m.role === 'user' ? 'background:var(--ac); color:#fff;' : ''}">
        <b>${m.role === 'user' ? 'Você' : '🤖 Complete AI'}</b>
        <div>${esc(m.text)}</div>
        ${m.code ? `<pre>${esc(m.code)}</pre><button class="p" style="margin-top:6px;" onclick="publishGeneratedGame('${esc(m.gameTitle)}')">🚀 Publicar este Jogo</button>` : ''}
      </div>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

function sendAIMessage() {
  const input = $('#ai-input'), query = input.value.trim();
  if (!query) return;
  input.value = ''; dataList.aiMsgs.push({ role: 'user', text: query });
  drawAIMessages();
  setTimeout(() => {
    dataList.aiMsgs.push({ role: 'ai', text: `Olá! Sou a IA do Complete Box. Como posso te ajudar com o site ou criar um novo jogo?` });
    drawAIMessages();
  }, 500);
}

function generateAIGame() {
  const input = $('#ai-game-prompt'), prompt = input.value.trim();
  if (!prompt) return toast('Digite uma ideia!');
  toast('⏳ IA gerando jogo...');
  setTimeout(() => {
    const code = `<!DOCTYPE html><html><head><style>body{margin:0;background:#111;color:#fff;text-align:center;font-family:sans-serif;}canvas{background:#222;border:2px solid #7c53ff;margin-top:10px;}</style></head><body><h2>🎮 ${prompt}</h2><canvas id="c" width="360" height="200"></canvas><p>Pontos: <b id="s">0</b></p><script>const c=document.getElementById('c'),x=c.getContext('2d');let score=0,py=150,vy=0,ox=360;window.onclick=()=>{if(py>=150)vy=-8;};function loop(){vy+=0.4;py+=vy;if(py>150){py=150;vy=0;}ox-=3;if(ox<-20){ox=360;score+=10;document.getElementById('s').textContent=score;}x.clearRect(0,0,360,200);x.fillStyle='#7c53ff';x.fillRect(40,py,20,20);x.fillStyle='#ff6b35';x.fillRect(ox,150,20,20);requestAnimationFrame(loop);}loop();<\/script></body></html>`;
    dataList.aiMsgs.push({ role: 'ai', text: `Jogo "${prompt}" gerado com sucesso!`, code, gameTitle: prompt });
    drawAIMessages();
  }, 1000);
}

async function publishGeneratedGame(title) {
  const lastMsg = [...dataList.aiMsgs].reverse().find(m => m.code);
  if (!lastMsg) return;
  const postObj = { title: 'Jogo IA: ' + title, content: lastMsg.code, by: uid, authorName: myProfile.name, authorBadge: myProfile.badge, ts: Date.now(), likes: [] };
  if (db) await db.collection('games').add(postObj);
  toast('🎮 Jogo publicado com sucesso!');
  go('games');
}

function profileView() {
  return `
    <div class="card">
      <div class="row">
        <span class="av" style="width:50px; height:50px; font-size:22px;">${myProfile.badge}</span>
        <div>
          <b style="font-size:18px;">${esc(myProfile.name)}</b>
          <div class="by">${isOwner ? 'Status: Dono Principal' : 'Status: Jogador'}</div>
        </div>
      </div>
    </div>
    <div class="card">
      <b>Configurações de Perfil</b>
      ${isOwner ? '<p class="rules">Você está logado como Dono Principal (Pedro Mesquita).</p>' : `
        <input id="new-name" value="${esc(myProfile.name)}">
        <button class="p" style="margin-top:6px;" onclick="myProfile.name=$('#new-name').value; saveProfileToGlobal(); toast('Nome salvo!'); render();">Salvar Nome</button>
        <hr style="border:0; border-top:1px solid var(--bd); margin:12px 0;">
        <input id="owner-pass" type="password" placeholder="Senha do Dono (Pedro)">
        <button class="s" style="margin-top:4px;" onclick="loginOwner()">Ativar Modo Dono</button>
      `}
    </div>
  `;
}

function loginOwner() {
  const pass = $('#owner-pass').value;
  if (pass === 'dono-pedro-2026') {
    localStorage.setItem(OWNER_KEY, 'true');
    location.reload();
  } else {
    toast('Senha incorreta!');
  }
}

function shopView() {
  return `
    <div class="card">
      <b>🛍️ Loja do Complete Box</b>
      <p class="rules">${isOwner ? 'Dono tem moedas ilimitadas.' : 'Ganhe moedas publicando posts e conversando no chat!'}</p>
    </div>
  `;
}

nav(); render(); setupGlobalSync();
</script>
</body>
</html>
