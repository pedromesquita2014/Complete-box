<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complete Box</title>
<style>
:root {
  --bg: #120e24;
  --card: #1c1738;
  --tx: #f3f0ff;
  --mu: #9b93c4;
  --ac: #7c53ff;
  --ac2: #ff6b35;
  --bd: #2d2654;
  --gold: #ffd700;
  --green: #22c55e;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(1200px 600px at 50% -100px, rgba(124,83,255,0.28), transparent), var(--bg);
  color: var(--tx);
  font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(28,23,56,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bd);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  font-weight: 900;
  font-size: 22px;
  background: linear-gradient(90deg, var(--ac), var(--ac2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -0.5px;
}
.online-badge {
  font-size: 11px;
  background: rgba(34,197,94,0.15);
  color: var(--green);
  border: 1px solid rgba(34,197,94,0.4);
  padding: 3px 8px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
}
.online-dot {
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--green);
}
.coins {
  margin-left: auto;
  font-weight: 800;
  background: rgba(255,215,0,0.1);
  border: 1px solid rgba(255,215,0,0.3);
  color: #ffe66d;
  border-radius: 20px;
  padding: 5px 12px;
  white-space: nowrap;
  font-size: 14px;
}
nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 16px;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: none;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  border-radius: 20px;
  padding: 8px 16px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
nav button:hover { border-color: var(--ac); }
nav button.on {
  background: linear-gradient(120deg, var(--ac), var(--ac2));
  color: #fff;
  border-color: transparent;
  font-weight: 800;
  box-shadow: 0 4px 14px rgba(124,83,255,0.4);
}
main {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 16px 40px;
}
.hero {
  margin: 0 16px 12px;
  padding: 16px;
  border-radius: 16px;
  color: #fff;
  background: linear-gradient(120deg, #7c53ff, #ff6b35);
  font-weight: 700;
  box-shadow: 0 6px 20px rgba(124,83,255,0.3);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 16px;
  margin: 14px 0;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
}
.rules { font-size: 13px; color: var(--mu); margin-bottom: 8px; }
input, textarea, select {
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: var(--tx);
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 10px 12px;
  margin: 6px 0;
}
input:focus, textarea:focus, select:focus {
  outline: 2px solid var(--ac);
  border-color: transparent;
}
button.p {
  background: linear-gradient(120deg, var(--ac), #a24bff);
  color: #fff;
  border: 0;
  border-radius: 12px;
  padding: 10px 18px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(124,83,255,0.35);
}
button.s {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--bd);
  color: var(--tx);
  border-radius: 10px;
  padding: 6px 12px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.by { font-size: 12px; color: var(--mu); }
.empty { text-align: center; color: var(--mu); padding: 32px 12px; }
iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 12px; background: #000; }
.av {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--ac);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  overflow: hidden;
  flex: none;
  font-size: 16px;
}
#toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  top: 75px;
  background: linear-gradient(120deg, var(--ac), var(--ac2));
  color: #fff;
  padding: 10px 20px;
  border-radius: 30px;
  font-weight: 700;
  z-index: 99;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.online-users-list { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0; }
.online-user-tag { background: var(--bg); border: 1px solid var(--bd); border-radius: 16px; padding: 4px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>

<header>
  <span class="logo">📦 Complete Box</span>
  <span class="online-badge"><span class="online-dot"></span> Online</span>
  <span class="coins" id="coins">🪙 0</span>
</header>

<div class="hero">
  <div>
    🌐 <b>Rede Global Conectada!</b>
    <div style="font-size: 12px; opacity: 0.9;">Missões, chat offline, roleta, poupança e loja ativos.</div>
  </div>
</div>

<nav id="nav"></nav>
<main id="app"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
function sanitize(input) {
  if (typeof input !== 'string') return input;
  return input.replace(/[<>]/g, '').slice(0, 1000);
}

const firebaseConfig = {
  apiKey: "AIzaSyAgRafNnzncOP631NU9oJTfyBNf6bIy1pQ",
  authDomain: "complete-box-2.firebaseapp.com",
  projectId: "complete-box-2",
  storageBucket: "complete-box-2.firebasestorage.app",
  messagingSenderId: "1010030427570",
  appId: "1:1010030427570:web:dc9c10130a8b98b0fbf8ab"
};

let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch(e) { console.warn("Offline", e); }

let uid = localStorage.getItem('cb_uid');
if (!uid) {
  uid = 'u_' + Math.random().toString(36).substring(2, 9);
  localStorage.setItem('cb_uid', uid);
}

const OWNER_KEY = 'cb_is_pedro_owner';
if (location.hash === '#pedromesquita2026' || localStorage.getItem(OWNER_KEY) === 'true') {
  localStorage.setItem(OWNER_KEY, 'true');
}

let isOwner = localStorage.getItem(OWNER_KEY) === 'true';
let myCoins = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_coins')) || 50);
let mySavings = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_savings')) || 0);

let myProfile = {
  name: isOwner ? 'Pedro Mesquita (Dono)' : (localStorage.getItem('cb_name') || 'Visitante_' + uid.slice(-4)),
  badge: isOwner ? '👑' : '👤',
  coins: myCoins,
  savings: mySavings
};

function saveProfileToGlobal() {
  if (!isOwner) {
    localStorage.setItem('cb_name', sanitize(myProfile.name));
    localStorage.setItem('cb_coins', myProfile.coins);
    localStorage.setItem('cb_savings', myProfile.savings);
  }
  if (db) {
    db.collection('profiles').doc(uid).set({
      name: sanitize(myProfile.name),
      badge: myProfile.badge,
      isOwner: isOwner,
      coins: isOwner ? 999999999 : myProfile.coins,
      ts: Date.now()
    }, { merge: true }).catch(() => {});
  }
}
saveProfileToGlobal();

function toast(msg) {
  document.querySelectorAll('#toast').forEach(x => x.remove());
  const e = document.createElement('div');
  e.id = 'toast';
  e.textContent = sanitize(msg);
  document.body.append(e);
  setTimeout(() => e.remove(), 3500);
}

let tab = 'videos';
let profiles = {};
let dataList = { videos: [], games: [], news: [], polls: [], chat: [] };
let onlineUsers = [];
let searchQuery = '';

const TABS = [
  ['videos', '🎬 Vídeos'],
  ['games', '🎮 Jogos'],
  ['chat', '💬 Chat'],
  ['missions', '🎯 Missões'],
  ['miner', '⛏️ Mineração'],
  ['spin', '🎡 Roleta'],
  ['bank', '🏦 Poupança'],
  ['shop', '🛍️ Loja'],
  ['me', '👤 Perfil']
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeAgo = ts => {
  if (!ts) return 'agora';
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 60) return 'agora';
  if (sec < 3600) return Math.floor(sec/60) + 'm atrás';
  return Math.floor(sec/3600) + 'h atrás';
};

function nav() {
  const el = $('#nav');
  if (el) el.innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('');
}

function go(k) { tab = k; searchQuery = ''; nav(); render(); }

function renderHeader() {
  const el = $('#coins');
  if (el) el.textContent = isOwner ? '🪙 ∞ (Dono)' : `🪙 ${myProfile.coins}`;
}

function setupGlobalSync() {
  if (!db) return;
  db.collection('profiles').onSnapshot(snap => {
    profiles = {}; onlineUsers = [];
    snap.docs.forEach(doc => {
      const d = doc.data(); profiles[doc.id] = d;
      if (d.ts && (Date.now() - d.ts < 300000)) onlineUsers.push({ id: doc.id, name: d.name || 'Usuário', badge: d.badge || '👤' });
    });
    if (tab === 'chat' || tab === 'bank') renderChatUsers();
  });

  ['videos', 'games', 'polls'].forEach(kind => {
    db.collection(kind).orderBy('ts', 'desc').limit(50).onSnapshot(snap => {
      dataList[kind] = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      if (tab === kind) renderContentList(kind);
    });
  });

  db.collection('global_chat').orderBy('ts', 'asc').limit(100).onSnapshot(snap => {
    dataList.chat = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    if (tab === 'chat') drawMessages();
  });
}

function render() {
  renderHeader();
  const app = $('#app');
  if (!app) return;

  if (tab === 'chat') { app.innerHTML = chatView(); drawMessages(); renderChatUsers(); return; }
  if (tab === 'missions') { app.innerHTML = missionsView(); return; }
  if (tab === 'miner') { app.innerHTML = minerView(); return; }
  if (tab === 'spin') { app.innerHTML = spinView(); return; }
  if (tab === 'bank') { app.innerHTML = bankView(); renderChatUsers(); return; }
  if (tab === 'shop') { app.innerHTML = shopView(); return; }
  if (tab === 'me') { app.innerHTML = profileView(); return; }

  app.innerHTML = `
    <div class="card">
      <b>🎬 Publicar Conteúdo Global</b>
      <input id="p-title" placeholder="Título" maxlength="100">
      <input id="p-content" placeholder="Link (YouTube / MP4)">
      <button class="p" style="margin-top:8px;" onclick="submitPost()">🚀 Publicar</button>
    </div>
    <div id="content-list"></div>
  `;
  renderContentList(tab);
}

function claimMission(key, reward) {
  if (localStorage.getItem('cb_m_' + key) === 'done') return toast('Já concluído!');
  localStorage.setItem('cb_m_' + key, 'done');
  if (!isOwner) { myProfile.coins += reward; saveProfileToGlobal(); }
  renderHeader(); render(); toast(`+${reward} moedas ganhas!`);
}

function missionsView() {
  return `
    <div class="card">
      <b>🎯 Missões Diárias</b>
      <p class="rules">Cumpra missões para ganhar moedas extras.</p>
    </div>
    <div class="card row" style="justify-content:space-between;">
      <div><b>Girar a Roleta</b><div class="rules">Ganhe 20 moedas</div></div>
      <button class="p" onclick="claimMission('spin', 20)">Resgatar</button>
    </div>
  `;
}

let minerClicks = 0;
function minerView() {
  return `
    <div class="card" style="text-align:center;">
      <b>⛏️ Mineração</b>
      <div style="margin:20px auto; width:100px; height:100px; background:var(--ac); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; cursor:pointer;" onclick="clickMiner()">💎</div>
      <div>Minerados: <b id="mc">${minerClicks}</b></div>
    </div>
  `;
}
function clickMiner() {
  minerClicks++;
  const el = $('#mc'); if(el) el.textContent = minerClicks;
  if(!isOwner && minerClicks % 10 === 0) { myProfile.coins += 5; saveProfileToGlobal(); renderHeader(); toast('+5 moedas!'); }
}

function spinView() {
  return `
    <div class="card" style="text-align:center;">
      <b>🎡 Roleta da Sorte</b>
      <p id="sp-txt" style="color:var(--gold); font-size:20px; margin:20px 0;">Gire para ganhar!</p>
      <button class="p" onclick="doSpin()">Girar 🎰</button>
    </div>
  `;
}
function doSpin() {
  const d = new Date().toDateString();
  if(localStorage.getItem('cb_spin') === d) return toast('Apenas 1 giro por dia!');
  localStorage.setItem('cb_spin', d);
  const w = [20, 50, 100, 200][Math.floor(Math.random()*4)];
  $('#sp-txt').textContent = `+${w} Moedas!`;
  if(!isOwner) { myProfile.coins += w; saveProfileToGlobal(); }
  renderHeader(); toast(`Ganhou ${w} moedas!`);
}

function bankView() {
  return `
    <div class="card">
      <b>🏦 Poupança Complete</b>
      <div style="margin:10px 0;">Carteira: <b>${isOwner?'∞':myProfile.coins}</b> | Poupança: <b>${isOwner?'∞':myProfile.savings}</b></div>
      <input id="bk-amt" type="number" placeholder="Valor" min="1">
      <div class="row" style="margin-top:6px;">
        <button class="p" onclick="dep()">Depositar</button>
        <button class="s" onclick="wit()">Sacar</button>
      </div>
    </div>
  `;
}
function dep() {
  const v = parseInt($('#bk-amt').value);
  if(!v || myProfile.coins < v) return toast('Valor inválido!');
  myProfile.coins -= v; myProfile.savings += v; saveProfileToGlobal(); render(); toast('Depositado!');
}
function wit() {
  const v = parseInt($('#bk-amt').value);
  if(!v || myProfile.savings < v) return toast('Valor inválido!');
  myProfile.savings -= v; myProfile.coins += v; saveProfileToGlobal(); render(); toast('Sacado!');
}

function shopView() {
  return `
    <div class="card">
      <b>🛍️ Loja Oficial</b>
      <p class="rules">Itens exclusivos. Transferência automática da poupança se faltar na carteira.</p>
    </div>
    <div class="card row" style="justify-content:space-between;">
      <div><b>👑 Coroa Lendária</b><div style="color:var(--gold)">🪙 500</div></div>
      <button class="p" onclick="buy('s1', 500, '👑')">Comprar</button>
    </div>
  `;
}
function buy(id, price, badge) {
  if(isOwner) { myProfile.badge = badge; saveProfileToGlobal(); return toast('Adquirido (Dono)!'); }
  let tot = myProfile.coins + myProfile.savings;
  if(tot < price) return toast('Saldo insuficiente!');
  if(myProfile.coins < price) { let diff = price - myProfile.coins; myProfile.coins = 0; myProfile.savings -= diff; }
  else { myProfile.coins -= price; }
  myProfile.badge = badge; saveProfileToGlobal(); renderHeader(); render(); toast('Compra realizada!');
}

function profileView() {
  return `
    <div class="card">
      <div class="row"><span class="av">${myProfile.badge}</span><div><b>${esc(myProfile.name)}</b><div class="by">${isOwner?'Dono':'Jogador'}</div></div></div>
    </div>
    <div class="card">
      <b>Painel do Dono</b>
      <input id="op-pass" type="password" placeholder="Senha do Dono">
      <button class="p" style="margin-top:6px;" onclick="if($('#op-pass').value==='dono-pedro-2026'){localStorage.setItem('${OWNER_KEY}','true');location.reload();}else{toast('Senha incorreta');}">Ativar</button>
    </div>
  `;
}

async function submitPost() {
  const t = sanitize($('#p-title').value), c = sanitize($('#p-content').value);
  if(!t || !c) return toast('Preencha os campos!');
  if(db) await db.collection(tab).add({title:t, content:c, by:uid, authorName:myProfile.name, authorBadge:myProfile.badge, ts:Date.now(), likes:[]});
  toast('Publicado!');
}
function renderContentList(k) {
  const box = $('#content-list'); if(!box) return;
  const items = dataList[k] || [];
  box.innerHTML = items.length ? items.map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.content)}</p></div>`).join('') : '<div class="empty">Nenhum post.</div>';
}
function chatView() {
  return `
    <div class="card"><b>💬 Chat Global</b><div class="online-users-list" id="ub"></div></div>
    <div id="msgs" style="height:40vh; overflow-y:auto; border:1px solid var(--bd); padding:10px; border-radius:10px; background:rgba(0,0,0,0.2);"></div>
    <div class="row" style="margin-top:10px;"><input id="ci" style="flex:1;" placeholder="Mensagem..."><button class="p" onclick="sendChat()">Enviar</button></div>
  `;
}
function renderChatUsers() {
  const b = $('#ub'); if(b) b.innerHTML = onlineUsers.map(u=>`<div class="online-user-tag"><span class="online-dot"></span>${esc(u.name)}</div>`).join('');
}
function drawMessages() {
  const m = $('#msgs'); if(!m) return;
  m.innerHTML = (dataList.chat||[]).map(x=>`<div style="margin:6px 0;"><b>${esc(x.authorName)}:</b> ${esc(x.text)}</div>`).join('');
  m.scrollTop = m.scrollHeight;
}
async function sendChat() {
  const i = $('#ci'); if(!i || !i.value.trim()) return;
  const text = sanitize(i.value.trim()); i.value='';
  if(db) await db.collection('global_chat').add({text, by:uid, authorName:myProfile.name, authorBadge:myProfile.badge, ts:Date.now()});
}

nav();
render();
setupGlobalSync();
</script>
</body>
</html>
