<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complete Box - Edição Suprema Global</title>
<style>
:root {
  --bg: #0b0914;
  --card: #15102a;
  --card-hover: #1f173d;
  --tx: #f3f0ff;
  --mu: #9b93c4;
  --ac: #7c53ff;
  --ac2: #ff6b35;
  --bd: #2b2254;
  --gold: #ffd700;
  --green: #22c55e;
  --red: #ef4444;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(1400px 700px at 50% -150px, rgba(124,83,255,0.32), transparent), var(--bg);
  color: var(--tx);
  font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(11,9,20,0.88);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--bd);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo {
  font-weight: 900;
  font-size: 24px;
  background: linear-gradient(90deg, var(--ac), var(--ac2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -0.5px;
}
.online-badge {
  font-size: 11px;
  background: rgba(34,197,94,0.12);
  color: var(--green);
  border: 1px solid rgba(34,197,94,0.35);
  padding: 4px 10px;
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
}
.online-dot {
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--green);
}
.coins {
  margin-left: auto;
  font-weight: 800;
  background: rgba(255,215,0,0.1);
  border: 1px solid rgba(255,215,0,0.3);
  color: #ffe66d;
  border-radius: 20px;
  padding: 6px 14px;
  white-space: nowrap;
  font-size: 14px;
  box-shadow: 0 0 15px rgba(255,215,0,0.1);
}
nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 20px;
  scrollbar-width: none;
  background: rgba(11,9,20,0.5);
  border-bottom: 1px solid rgba(43,34,84,0.4);
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: none;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  border-radius: 20px;
  padding: 8px 16px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
nav button:hover { border-color: var(--ac); background: var(--card-hover); transform: translateY(-1px); }
nav button.on {
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff;
  border-color: transparent;
  font-weight: 800;
  box-shadow: 0 6px 18px rgba(124,83,255,0.45);
}
main {
  max-width: 820px;
  margin: 0 auto;
  padding: 16px 20px 60px;
}
.hero {
  margin: 0 0 16px;
  padding: 18px 20px;
  border-radius: 18px;
  color: #fff;
  background: linear-gradient(135deg, #7c53ff, #ff6b35);
  font-weight: 700;
  box-shadow: 0 8px 25px rgba(124,83,255,0.35);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 18px;
  padding: 20px;
  margin: 16px 0;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  transition: border-color 0.2s;
}
.card:hover { border-color: rgba(124,83,255,0.4); }
.rules { font-size: 13px; color: var(--mu); margin-bottom: 8px; }
input, textarea, select {
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: var(--tx);
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 8px 0;
  transition: all 0.2s;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--ac);
  box-shadow: 0 0 0 3px rgba(124,83,255,0.25);
}
textarea { min-height: 100px; resize: vertical; }
button.p {
  background: linear-gradient(135deg, var(--ac), #925fff);
  color: #fff;
  border: 0;
  border-radius: 12px;
  padding: 11px 20px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(124,83,255,0.4);
  transition: transform 0.15s, opacity 0.2s;
}
button.p:active { transform: scale(0.97); }
button.s {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--bd);
  color: var(--tx);
  border-radius: 12px;
  padding: 8px 14px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
button.s:hover { background: rgba(255,255,255,0.08); border-color: var(--ac); }
button.s.on { background: var(--ac); border-color: transparent; color: #fff; }
button.danger {
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.35);
  color: var(--red);
  border-radius: 10px;
  padding: 6px 12px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}
button.danger:hover { background: rgba(239, 68, 68, 0.25); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.by { font-size: 12px; color: var(--mu); }
.empty { text-align: center; color: var(--mu); padding: 40px 16px; font-weight: 500; }
iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 12px; background: #000; }
iframe.g { aspect-ratio: 4/3; background: #fff; width: 100%; border-radius: 12px; border: 1px solid var(--bd); }
.av {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  overflow: hidden;
  flex: none;
  font-size: 22px;
  box-shadow: 0 4px 12px rgba(124,83,255,0.3);
}
#toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  top: 85px;
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff;
  padding: 12px 24px;
  border-radius: 30px;
  font-weight: 700;
  z-index: 999;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn { from { transform: translate(-50%, -20px) scale(0.8); opacity: 0; } }
.online-users-list { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0; scrollbar-width: none; }
.online-users-list::-webkit-scrollbar { display: none; }
.online-user-tag { background: var(--bg); border: 1px solid var(--bd); border-radius: 16px; padding: 6px 12px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>

<header>
  <span class="logo">📦 Complete Box</span>
  <span class="online-badge"><span class="online-dot"></span> Online</span>
  <span class="coins" id="coins">🪙 0</span>
</header>

<div style="max-width:820px; margin: 16px auto 0; padding: 0 20px;">
  <div class="hero">
    <div>
      🌐 <b>Rede Global Conectada!</b>
      <div style="font-size: 12px; opacity: 0.95; margin-top: 2px;">Sistema Otimizado com Alta Performance e Recursos Supremos.</div>
    </div>
  </div>
</div>

<nav id="nav"></nav>
<main id="app"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
function sanitize(input) {
  if (typeof input !== 'string') return input;
  return input.replace(/[<>]/g, '').slice(0, 1000);
}

const firebaseConfig = {
  apiKey: "AIzaSyAgRafNnzncOP631NU9oJTfyBNf6bIy1pQ",
  authDomain: "complete-box-2.firebaseapp.com",
  projectId: "complete-box-2",
  storageBucket: "complete-box-2.firebasestorage.app",
  messagingSenderId: "1010030427570",
  appId: "1:1010030427570:web:dc9c10130a8b98b0fbf8ab"
};

let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch(e) { console.warn("Offline", e); }

let uid = localStorage.getItem('cb_uid');
if (!uid) {
  uid = 'u_' + Math.random().toString(36).substring(2, 9);
  localStorage.setItem('cb_uid', uid);
}

const OWNER_KEY = 'cb_is_pedro_owner';
if (location.hash === '#pedromesquita2026' || localStorage.getItem(OWNER_KEY) === 'true') {
  localStorage.setItem(OWNER_KEY, 'true');
}

let isOwner = localStorage.getItem(OWNER_KEY) === 'true';
let myCoins = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_coins')) || 50);
let mySavings = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_savings')) || 0);
let myBadge = localStorage.getItem('cb_badge') || (isOwner ? '👑' : '👤');

let myProfile = {
  name: isOwner ? 'Pedro Mesquita (Dono)' : (localStorage.getItem('cb_name') || 'Visitante_' + uid.slice(-4)),
  badge: myBadge,
  coins: myCoins,
  savings: mySavings
};

function saveProfileToGlobal() {
  if (!isOwner) {
    localStorage.setItem('cb_name', sanitize(myProfile.name));
    localStorage.setItem('cb_coins', myProfile.coins);
    localStorage.setItem('cb_savings', myProfile.savings);
    localStorage.setItem('cb_badge', myProfile.badge);
  }
  if (db) {
    db.collection('profiles').doc(uid).set({
      name: sanitize(myProfile.name),
      badge: myProfile.badge,
      isOwner: isOwner,
      coins: isOwner ? 999999999 : myProfile.coins,
      ts: Date.now()
    }, { merge: true }).catch(() => {});
  }
}
saveProfileToGlobal();

function toast(msg) {
  document.querySelectorAll('#toast').forEach(x => x.remove());
  const e = document.createElement('div');
  e.id = 'toast';
  e.textContent = sanitize(msg);
  document.body.append(e);
  setTimeout(() => e.remove(), 3500);
}

let tab = 'videos';
let profiles = {};
let dataList = { videos: [], games: [], polls: [], chat: [] };
let onlineUsers = [];
let shopCategory = 'coroas';

const TABS = [
  ['videos', '🎬 Vídeos'],
  ['games', '🎮 Jogos'],
  ['chat', '💬 Chat'],
  ['chest', '🎁 Baú 1h'],
  ['missions', '🎯 Missões'],
  ['miner', '⛏️ Mineração'],
  ['spin', '🎡 Roleta'],
  ['bank', '🏦 Poupança'],
  ['shop', '🛍️ Loja'],
  ['me', '👤 Perfil']
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeAgo = ts => {
  if (!ts) return 'agora';
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 60) return 'agora';
  if (sec < 3600) return Math.floor(sec/60) + 'm atrás';
  return Math.floor(sec/3600) + 'h atrás';
};

function nav() {
  const el = $('#nav');
  if (el) el.innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('');
}

function go(k) { tab = k; nav(); render(); }

function renderHeader() {
  const el = $('#coins');
  if (el) el.textContent = isOwner ? '🪙 ∞ (Dono)' : `🪙 ${myProfile.coins}`;
}

function setupGlobalSync() {
  if (!db) return;
  db.collection('profiles').onSnapshot(snap => {
    profiles = {}; onlineUsers = [];
    snap.docs.forEach(doc => {
      const d = doc.data(); profiles[doc.id] = d;
      if (d.ts && (Date.now() - d.ts < 300000)) onlineUsers.push({ id: doc.id, name: d.name || 'Usuário', badge: d.badge || '👤' });
    });
    if (tab === 'chat' || tab === 'bank') renderChatUsers();
  });

  ['videos', 'games', 'polls'].forEach(kind => {
    db.collection(kind).orderBy('ts', 'desc').limit(50).onSnapshot(snap => {
      dataList[kind] = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      if (tab === kind) renderContentList(kind);
    });
  });

  db.collection('global_chat').orderBy('ts', 'asc').limit(100).onSnapshot(snap => {
    dataList.chat = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    if (tab === 'chat') drawMessages();
  });
}

function render() {
  renderHeader();
  const app = $('#app');
  if (!app) return;

  if (tab === 'chat') { app.innerHTML = chatView(); drawMessages(); renderChatUsers(); return; }
  if (tab === 'chest') { app.innerHTML = chestView(); return; }
  if (tab === 'missions') { app.innerHTML = missionsView(); return; }
  if (tab === 'miner') { app.innerHTML = minerView(); return; }
  if (tab === 'spin') { app.innerHTML = spinView(); return; }
  if (tab === 'bank') { app.innerHTML = bankView(); renderChatUsers(); return; }
  if (tab === 'shop') { app.innerHTML = shopView(); return; }
  if (tab === 'me') { app.innerHTML = profileView(); return; }

  let titles = { videos: '🎬 Publicar Vídeo Global', games: '🎮 Publicar Jogo HTML', polls: '📊 Criar Enquete' };
  app.innerHTML = `
    <div class="card">
      <b style="font-size:16px;">${titles[tab] || 'Publicar'}</b>
      <p class="rules">Compartilhe conteúdos instantaneamente na rede global.</p>
      <input id="p-title" placeholder="Título da publicação" maxlength="100">
      ${tab === 'games' ? '<textarea id="p-content" placeholder="Cole o código HTML completo do seu jogo aqui..."></textarea>' : '<input id="p-content" placeholder="Link do YouTube ou URL direta (.mp4)">'}
      <button class="p" style="margin-top:10px; width:100%;" onclick="submitPost('${tab}')">🚀 Publicar Agora</button>
    </div>
    <div id="content-list"></div>
  `;
  renderContentList(tab);
}

// --- BAÚ 1 HORA ---
function chestView() {
  const lastChest = parseInt(localStorage.getItem('cb_last_chest') || '0');
  const now = Date.now();
  const diff = now - lastChest;
  const oneHour = 3600000;
  const canClaim = diff >= oneHour;
  const timeLeft = canClaim ? 0 : Math.ceil((oneHour - diff) / 60000);

  return `
    <div class="card" style="text-align:center; padding:30px 20px;">
      <b style="font-size:22px;">🎁 Baú Misterioso (A cada 1h)</b>
      <p class="rules" style="margin-top:6px;">Retorne a cada 1 hora para abrir seu baú e resgatar moedas surpresa!</p>
      <div style="font-size:64px; margin:24px 0; animation: bounce 2s infinite;">📦</div>
      <div style="margin-bottom:20px; font-weight:bold; font-size:16px; color:var(--gold);">
        ${canClaim ? '✨ Baú Disponível para Resgatar!' : `⏳ Próximo baú disponível em ${timeLeft} minutos.`}
      </div>
      <button class="p" style="padding:14px 28px; font-size:16px;" ${canClaim ? '' : 'disabled style="opacity:0.5; cursor:not-allowed;"'} onclick="claimChest()">Abrir Baú 🔓</button>
    </div>
  `;
}

function claimChest() {
  const lastChest = parseInt(localStorage.getItem('cb_last_chest') || '0');
  const now = Date.now();
  if (now - lastChest < 3600000) return toast('O baú ainda está em tempo de recarga (1h)!');
  localStorage.setItem('cb_last_chest', now);
  const reward = Math.floor(Math.random() * 80) + 40;
  if (!isOwner) { myProfile.coins += reward; saveProfileToGlobal(); }
  renderHeader(); render();
  toast(`🎉 Você abriu o baú e ganhou ${reward} moedas!`);
}

// Missões
function claimMission(key, reward) {
  if (localStorage.getItem('cb_m_' + key) === 'done') return toast('Missão já concluída!');
  localStorage.setItem('cb_m_' + key, 'done');
  if (!isOwner) { myProfile.coins += reward; saveProfileToGlobal(); }
  renderHeader(); render(); toast(`🎉 +${reward} Complete Coins resgatadas!`);
}

function missionsView() {
  return `
    <div class="card">
      <b style="font-size:18px;">🎯 Missões Diárias</b>
      <p class="rules">Complete as tarefas para acumular moedas na sua carteira.</p>
    </div>
    <div class="card row" style="justify-content:space-between;">
      <div>
        <b style="font-size:15px;">Girar a Roleta da Sorte</b>
        <div class="rules" style="margin:2px 0 0;">Teste sua sorte hoje e ganhe 20 moedas.</div>
      </div>
      <button class="p" onclick="claimMission('spin', 20)">Resgatar 🎁</button>
    </div>
  `;
}

// Mineração
let minerClicks = 0;
function minerView() {
  return `
    <div class="card" style="text-align:center; padding:30px 20px;">
      <b style="font-size:20px;">⛏️ Mineração de Complete Coins</b>
      <p class="rules">Clique rapidamente no bloco abaixo para farmar moedas na sua sessão!</p>
      <div style="margin:30px auto; width:130px; height:130px; background:linear-gradient(135deg, var(--ac), var(--ac2)); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:45px; cursor:pointer; box-shadow: 0 0 30px rgba(124,83,255,0.5); transition: transform 0.1s;" onclick="clickMiner()" onmousedown="this.style.transform='scale(0.92)'" onmouseup="this.style.transform='scale(1)'">
        💎
      </div>
      <div style="font-size:16px; color:var(--gold);">Moedas mineradas nesta sessão: <b id="mc">${minerClicks}</b></div>
    </div>
  `;
}
function clickMiner() {
  minerClicks++;
  const el = $('#mc'); if(el) el.textContent = minerClicks;
  if(!isOwner && minerClicks % 10 === 0) { myProfile.coins += 5; saveProfileToGlobal(); renderHeader(); toast('⚡ +5 moedas mineradas!'); }
}

// Roleta
function spinView() {
  return `
    <div class="card" style="text-align:center; padding:30px 20px;">
      <b style="font-size:20px;">🎡 Roleta da Sorte Diária</b>
      <p class="rules">Gire a roleta uma vez por dia e ganhe prêmios instantâneos!</p>
      <div id="sp-txt" style="color:var(--gold); font-size:22px; font-weight:800; margin:24px 0; padding:15px; background:var(--bg); border:2px dashed var(--ac); border-radius:12px;">🎁 PRÓXIMO GIRO PRONTO</div>
      <button class="p" style="padding:14px 28px; font-size:16px;" onclick="doSpin()">Girar Roleta Agora 🎰</button>
    </div>
  `;
}
function doSpin() {
  const d = new Date().toDateString();
  if(localStorage.getItem('cb_spin') === d) return toast('⏰ Você já girou a roleta hoje! Volte amanhã.');
  localStorage.setItem('cb_spin', d);
  const w = [20, 50, 100, 200][Math.floor(Math.random()*4)];
  $('#sp-txt').textContent = `🎉 +${w} Moedas Ganhas!`;
  if(!isOwner) { myProfile.coins += w; saveProfileToGlobal(); }
  renderHeader(); toast(`🎉 Parabéns! Você ganhou ${w} moedas!`);
}

// Banco
function bankView() {
  return `
    <div class="card">
      <b style="font-size:18px;">🏦 Poupança Complete & Transferências</b>
      <p class="rules">Guarde suas moedas com segurança. Ao comprar itens na Loja, se faltar na carteira, o saldo da poupança é transferido automaticamente!</p>
      
      <div style="background:var(--bg); border:1px solid var(--bd); border-radius:12px; padding:14px; margin: 14px 0;">
        <div style="font-size:14px; color:var(--mu);">Saldo na Carteira: <b>🪙 ${isOwner ? '∞' : myProfile.coins}</b></div>
        <div style="font-size:16px; margin-top:4px; color:var(--gold);">Saldo na Poupança: <b>🪙 ${isOwner ? '∞' : myProfile.savings}</b></div>
      </div>

      <input id="bk-amt" type="number" placeholder="Quantidade de moedas" min="1">
      <div class="row" style="margin-top:8px;">
        <button class="p" style="flex:1;" onclick="dep()">Depositar na Poupança 📥</button>
        <button class="s" style="flex:1;" onclick="wit()">Sacar para Carteira 📤</button>
      </div>
    </div>
  `;
}
function dep() {
  const v = parseInt($('#bk-amt').value);
  if(!v || v <= 0 || myProfile.coins < v) return toast('Quantidade inválida ou saldo insuficiente na carteira!');
  myProfile.coins -= v; myProfile.savings += v; saveProfileToGlobal(); render(); toast(`🪙 Depositado ${v} moedas na poupança!`);
}
function wit() {
  const v = parseInt($('#bk-amt').value);
  if(!v || v <= 0 || myProfile.savings < v) return toast('Quantidade inválida ou saldo insuficiente na poupança!');
  myProfile.savings -= v; myProfile.coins += v; saveProfileToGlobal(); render(); toast(`🪙 Sacado ${v} moedas para a carteira!`);
}

// --- LOJA ORGANIZADA POR CATEGORIAS (100+ ITENS) ---
const EMOJIS = ['👑','⚡','🔥','💎','🚀','⭐','🌟','🏆','🎯','🎨','🔮','🛡️','🗡️','🐉','🐯','🦅','🍀','💎','🎩','🎸','🍕','🍔','⚡','🛸','💡','🪐','🎲','🍉','💎','🍩'];
const ADJ = ['Lendário','Supremo','Místico','Cósmico','Galáctico','Elite','Imperial','Divino','Solar','Lunar','Titanium','Cyber','Fênix','Soberano','Alpha','Quantum','Vanguard','Stellar','Neon','Prime'];
const TYPE = ['Coroa','Escudo','Espada','Orbe','Símbolo','Manto','Anel','Cristal','Aura','Emblema'];

let SHOP_ITEMS = [];
for (let i = 1; i <= 100; i++) {
  let cat = i <= 25 ? 'coroas' : i <= 50 ? 'auras' : i <= 75 ? 'espadas' : 'emblemas';
  let badge = EMOJIS[(i - 1) % EMOJIS.length];
  let name = `${badge} ${TYPE[(i - 1) % TYPE.length]} ${ADJ[(i - 1) % TYPE.length]} #${i}`;
  let desc = `Item exclusivo nível ${i} para customização avançada de perfil.`;
  let price = 250 + (i * 50);
  SHOP_ITEMS.push({ id: 'item_' + i, name, desc, price, badge, category: cat });
}

function shopView() {
  const cats = [
    ['coroas', '👑 Coroas'],
    ['auras', '🔥 Auras & Mantos'],
    ['espadas', '🗡️ Espadas & Escudos'],
    ['emblemas', '💎 Emblemas Cósmicos']
  ];

  const filteredItems = SHOP_ITEMS.filter(i => i.category === shopCategory);

  return `
    <div class="card">
      <b style="font-size:18px;">🛍️ Loja Oficial Organizada (100+ Itens)</b>
      <p class="rules">Escolha sua categoria favorita. Se faltar saldo na carteira, o sistema utiliza a sua poupança automaticamente!</p>
      <div style="font-size:14px; color:var(--gold); margin-bottom:14px; font-weight:700;">Disponível (Carteira + Poupança): 🪙 ${isOwner ? '∞' : (myProfile.coins + myProfile.savings)}</div>
      
      <div class="row" style="gap:6px;">
        ${cats.map(([k, l]) => `<button class="s ${shopCategory===k?'on':''}" onclick="shopCategory='${k}'; render();">${l}</button>`).join('')}
      </div>
    </div>

    <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:14px;">
      ${filteredItems.map(i => `
        <div class="card" style="margin:0; display:flex; flex-direction:column; justify-content:space-between;">
          <div>
            <div style="font-size:28px; margin-bottom:8px;">${i.badge}</div>
            <b style="font-size:15px; display:block; margin-bottom:4px;">${esc(i.name)}</b>
            <div class="rules" style="font-size:12px; margin-bottom:12px;">${esc(i.desc)}</div>
          </div>
          <div>
            <div style="color:var(--gold); font-weight:bold; margin-bottom:10px;">🪙 ${i.price} Moedas</div>
            <button class="p" style="width:100%; padding:10px;" onclick="buy('${i.id}', ${i.price}, '${i.badge}')">Comprar 🛒</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function buy(id, price, badge) {
  if(isOwner) { 
    myProfile.badge = badge; 
    saveProfileToGlobal(); 
    return toast('🎉 Item adquirido instantaneamente (Dono)!'); 
  }
  let tot = myProfile.coins + myProfile.savings;
  if(tot < price) return toast('❌ Saldo insuficiente na Carteira e na Poupança!');
  if(myProfile.coins < price) { 
    let diff = price - myProfile.coins; 
    myProfile.coins = 0; 
    myProfile.savings -= diff; 
  } else { 
    myProfile.coins -= price; 
  }
  myProfile.badge = badge; 
  saveProfileToGlobal(); 
  renderHeader(); 
  render(); 
  toast('🎉 Compra realizada com sucesso! Saldo debitado e item aplicado.');
}

// --- PUBLICAR E APAGAR POSTS COM 1 CLIQUE ---
async function submitPost(kind) {
  const t = sanitize($('#p-title').value), c = sanitize($('#p-content').value);
  if(!t || !c) return toast('❌ Preencha todos os campos!');
  if(db) await db.collection(kind).add({title:t, content:c, by:uid, authorName:myProfile.name, authorBadge:myProfile.badge, ts:Date.now(), likes:[]});
  toast('🎉 Publicado globalmente com sucesso!');
  go(kind);
}

async function deletePost(kind, id) {
  if (confirm('Deseja realmente apagar esta publicação da rede global?')) {
    if (db) await db.collection(kind).doc(id).delete();
    toast('🗑️ Publicação apagada com sucesso!');
    render();
  }
}

function renderContentList(k) {
  const box = $('#content-list'); if(!box) return;
  const items = dataList[k] || [];
  if (!items.length) { box.innerHTML = '<div class="empty">📭 Nenhum conteúdo publicado no momento. Seja o primeiro a postar!</div>'; return; }

  box.innerHTML = items.map(x => {
    let body = '';
    if (k === 'videos') {
      const ytMatch = x.content.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
      body = ytMatch ? `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen></iframe>` : `<a href="${esc(x.content)}" target="_blank" style="color:var(--ac)">🔗 ${esc(x.content)}</a>`;
    } else if (k === 'games') {
      body = `<div style="background:#000; border-radius:12px; padding:6px;"><iframe class="g" srcdoc="${esc(x.content)}"></iframe></div>`;
    }
    const canDelete = isOwner || x.by === uid;
    return `
      <div class="card">
        <div class="row" style="margin-bottom:10px; justify-content:space-between;">
          <div class="row">
            <span class="av" style="width:40px; height:40px; font-size:16px;">${esc(x.authorBadge || '👤')}</span>
            <div><b>${esc(x.authorName)}</b><div class="by">${timeAgo(x.ts)}</div></div>
          </div>
          ${canDelete ? `<button class="danger" onclick="deletePost('${k}', '${x.id}')">🗑️ Apagar</button>` : ''}
        </div>
        <h3 style="margin:8px 0 12px; font-size:18px;">${esc(x.title)}</h3>
        ${body}
      </div>
    `;
  }).join('');
}

// --- CHAT COM MENSAGENS OFFLINE / DIRETAS ---
function chatView() {
  return `
    <div class="card">
      <b style="font-size:16px;">💬 Chat Global & Mensagens Offline</b>
      <p class="rules">Envie mensagens públicas para todos ou selecione um usuário específico (mesmo offline) para enviar uma mensagem direta que ele lerá assim que entrar no site.</p>
      <select id="dm-target" style="margin:8px 0;">
        <option value="">💬 Todos no Chat Global</option>
        ${Object.keys(profiles).map(id => `<option value="${id}">${esc(profiles[id].badge || '👤')} ${esc(profiles[id].name || 'Usuário')}</option>`).join('')}
      </select>
    </div>
    <div class="card" style="padding:10px; margin-bottom:10px;">
      <div class="online-users-list" id="ub"></div>
    </div>
    <div id="msgs" style="height:42vh; overflow-y:auto; border:1px solid var(--bd); padding:14px; border-radius:14px; background:rgba(11,9,20,0.6);"></div>
    <div class="row" style="margin-top:12px;">
      <input id="ci" style="flex:1;" placeholder="Escreva sua mensagem..." onkeydown="if(event.key==='Enter')sendChat()">
      <button class="p" onclick="sendChat()">Enviar 🚀</button>
    </div>
  `;
}

function renderChatUsers() {
  const b = $('#ub'); if(b) b.innerHTML = onlineUsers.map(u=>`<div class="online-user-tag"><span class="online-dot"></span>${esc(u.badge || '👤')} ${esc(u.name)}</div>`).join('');
}

function drawMessages() {
  const m = $('#msgs'); if(!m) return;
  const msgs = dataList.chat || [];
  const filtered = msgs.filter(x => !x.targetId || x.targetId === uid || x.by === uid);
  
  m.innerHTML = filtered.map(x => `
    <div style="margin:10px 0; padding:10px 14px; background:rgba(28,23,56,0.6); border:1px solid var(--bd); border-radius:12px;">
      <div class="row" style="margin-bottom:4px;">
        <span><b>${esc(x.authorBadge || '👤')} ${esc(x.authorName)}</b> ${x.targetId ? '🔒 <span style="font-size:11px; color:var(--gold);">(Mensagem Direta / Offline)</span>' : ''}</span>
        <span class="by" style="margin-left:auto;">${timeAgo(x.ts)}</span>
      </div>
      <div style="word-break:break-word; font-size:14px;">${esc(x.text)}</div>
    </div>
  `).join('');
  m.scrollTop = m.scrollHeight;
}

async function sendChat() {
  const i = $('#ci'); if(!i || !i.value.trim()) return;
  const text = sanitize(i.value.trim()); i.value='';
  const targetId = $('#dm-target') ? $('#dm-target').value : '';

  if(db) await db.collection('global_chat').add({
    text, 
    by: uid, 
    targetId: targetId || null, 
    authorName: myProfile.name, 
    authorBadge: myProfile.badge, 
    ts: Date.now()
  });
}
