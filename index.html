const AI_SYS='Você é a Complete AI, a assistente do site Complete Box. Responda em português do Brasil, de forma amigável, clara, completa e muito útil. Você ajuda com perguntas em geral, estudos, ideias e principalmente a criar jogos (código HTML/JS completo em um único arquivo que o usuário cola na aba Jogos; para entrar nos rankings o jogo deve chamar parent.postMessage({score:PONTOS},"*")), além de ideias de vídeos e notícias boas. Nunca use palavrões nem conteúdo ofensivo ou abusivo. Não copie jogos existentes: sugira ideias originais. Sobre o site: ganha-se Complete Coins conversando com amigos em dias diferentes, publicando (+10 por post) e na recompensa diária da Loja, que vende molduras, cores de nome e fundos de chat; há abas de Vídeos, Jogos, Chat, Complete News, Rankings e Perfil.';
function aiView(){return `<div class="card"><b>🤖 Complete AI</b><p class="rules">Pergunte qualquer coisa ou peça ajuda para criar seu jogo, ideias de vídeo e mais. Na primeira vez, será pedida sua permissão.</p></div><div class="card"><b>🎮 Criar jogo com IA</b><p class="rules">Descreva a ideia e a IA cria um jogo original para você testar e publicar na aba Jogos.</p><input id="gm-i" placeholder="Ex.: pular obstáculos no espaço" maxlength="120"><div class="row"><button class="p" onclick="makeGame()">Criar jogo</button></div><div id="gm-o"></div></div><div class="row" style="margin-bottom:8px">${['Crie um jogo original para mim','Ideia de vídeo legal','Como ganho Complete Coins?'].map(t=>`<button class="s" onclick="document.getElementById('ai-i').value='${t}';askAI()">${t}</button>`).join('')}</div><div id="aib"></div><div class="row" style="margin-top:8px"><input id="ai-i" placeholder="Pergunte à Complete AI" style="flex:1" onkeydown="if(event.key==='Enter')askAI()"><button class="p" onclick="askAI()">Enviar</button></div>`}
function fmt(t){return esc(t).split('```').map((s,i)=>i%2?'<pre>'+s.replace(/^[a-z]*\n/,'')+'</pre>':s.replace(/\n/g,'<br>')).join('')}
function drawAI(){const b=$('#aib');if(!b)return;b.innerHTML=aiMsgs.length?aiMsgs.map(m=>`<div class="m" style="${m.r==='user'?'flex-direction:row-reverse':''}"><div class="bub" style="max-width:92%;${m.r==='user'?'background:var(--ac);color:#fff':''}">${fmt(m.t)}</div></div>`).join(''):'<div class="empty">Diga oi para a Complete AI 👋</div>'}
async function askAI(){
 const i=$('#ai-i'),q=i.value.trim();if(!q||aiBusy)return;if(!guard(q,'chat'))return;
 let s=null;try{s=await claude.use('sample')}catch(e){}
 if(!s){alert('A Complete AI não está disponível aqui.');return}
 i.value='';aiMsgs.push({r:'user',t:q});const a={r:'assistant',t:'...'};aiMsgs.push(a);aiBusy=true;drawAI();
 const hist=aiMsgs.slice(0,-1).slice(-9).map(m=>({role:m.r,content:m.t}));
 hist[0]={role:'user',content:'[Instruções]\n'+AI_SYS+'\n\n[Conversa]\n'+hist[0].content};
 try{const r=await s(hist,{cache:false,modelTier:'complex',onText:({text})=>{a.t=text;drawAI()}});a.t=r.text||a.t}
 catch(e){a.t=e.code==='not_granted'?'Você precisa permitir o acesso da Complete AI. Tente de novo e aceite.':e.code==='rate_limited'?'Muitas perguntas seguidas. Espere um pouco e tente de novo.':'Não consegui responder agora. Tente de novo.'}
 aiBusy=false;drawAI()}
function render(){
  const a=$('#app');
  if(tab==='chat'){a.innerHTML=(!db&&LOADED.videos)?LOCK:chatView();drawMsgs();return}
  if(tab==='me'){a.innerHTML=meView();return}
  if(tab==='shop'){a.innerHTML=shopView();return}
  if(tab==='rank'){a.innerHTML=rankView();return}
  if(tab==='speak'){a.innerHTML=speakView();if(sp.m==='t')drawSp();return}
  if(tab==='arcade'){a.innerHTML=arcView();return}
  if(tab==='polls'){a.innerHTML=pollView();return}
  if(tab==='ai'){a.innerHTML=aiView();drawAI();return}
  if(tab==='daily'){a.innerHTML=dailyView();return}
  const kind=tab;a.innerHTML=(kind==='news'?'<h2 style="margin:14px 0 0">📰 Complete News</h2>':'')+postForm(kind)+toolbar()+'<div id="lst">'+list(kind)+'</div>'}
function keep(){if(tab==='games'&&document.querySelector('iframe.g'))return;const a=document.activeElement;if(a&&a.tagName==='IFRAME')return;if(a&&a.id==='sq'){relist();return}if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;if(tab==='videos'||tab==='games'||tab==='news'||tab==='rank'||tab==='shop'||tab==='polls')render()}
nav();render();head();
(async()=>{
  try{
    const user=await claude.use('user');const d=await claude.use('db');
    if(user){try{uid=await user.id();isAdmin=user.canEdit()}catch(e){}}head();
    if(!d){$('#nav').insertAdjacentHTML('afterend','<div class="card" style="margin:0 14px">🔒 <b>Entre na sua conta Claude</b> para ver e publicar no Complete Box. Sem login funcionam só o Arcade e o Complete Speak (frases e quiz).</div>');['videos','games','news','polls','scores','gifts'].forEach(k=>LOADED[k]=1);render();return}db=d;
    db.collection('profiles').onSnapshot(s=>{s.docs.forEach(x=>P[x.id]=x.data());if(P[uid])me=P[uid];else{me=P[uid]={coins:0,name:'Jogador'+uid.slice(-4)};db.doc('profiles/'+uid).set(me).catch(()=>{})}head();if(tab==='chat'){drawMsgs();refreshSel()}else keep()});
    ['videos','games','news','scores','gifts','polls'].forEach(k=>db.collection(k).orderBy('ts','desc').limit(k==='scores'||k==='gifts'?400:60).onSnapshot(s=>{D[k]=s.docs.map(x=>({id:x.id,...x.data()})).filter(x=>(x.rep||0)<5);LOADED[k]=1;if(tab===k||tab==='rank'||(tab==='shop'&&k==='gifts'))keep()}));
    chatSub();
    setTimeout(()=>{if(me.dLast!==today())toast('🎁 Recompensa diária disponível!')},5200);setTimeout(()=>{if(me.entry)toast('✨ '+nm(uid)+' '+me.entry)},1500);
  }catch(e){console.error(e)}
})();
</script></body></html>
