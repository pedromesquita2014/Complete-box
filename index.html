<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complete Box - O Melhor Site do Mundo</title>
<style>
:root {
  --bg: #060913;
  --card: #0f172a;
  --card-hover: #1e293b;
  --tx: #f8fafc;
  --mu: #94a3b8;
  --ac: #3b82f6;
  --ac2: #8b5cf6;
  --bd: #1e293b;
  --gold: #f59e0b;
  --ultra: #00f0ff;
  --green: #10b981;
  --red: #ef4444;
  --pink: #ec4899;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(1800px 900px at 50% -200px, rgba(59,130,246,0.2), transparent), radial-gradient(1200px 600px at 50% 100%, rgba(139,92,246,0.15), transparent), var(--bg);
  color: var(--tx);
  font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(6,9,19,0.88);
  backdrop-filter: blur(25px);
  border-bottom: 1px solid var(--bd);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo {
  font-weight: 900;
  font-size: 24px;
  background: linear-gradient(90deg, #3b82f6, #00f0ff, #8b5cf6);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -0.5px;
}
.online-badge {
  font-size: 11px;
  background: rgba(16,185,129,0.12);
  color: var(--green);
  border: 1px solid rgba(16,185,129,0.35);
  padding: 4px 10px;
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
}
.online-dot {
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--green);
}
.wallet-box {
  margin-left: auto;
  display: flex;
  gap: 8px;
  align-items: center;
}
.currency-pill {
  font-weight: 800;
  background: rgba(245,158,11,0.1);
  border: 1px solid rgba(245,158,11,0.3);
  color: #fbbf24;
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  box-shadow: 0 4px 12px rgba(245,158,11,0.1);
}
.currency-pill.ultra {
  background: rgba(0,240,255,0.1);
  border-color: rgba(0,240,255,0.3);
  color: var(--ultra);
  box-shadow: 0 4px 12px rgba(0,240,255,0.1);
}
nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 24px;
  scrollbar-width: none;
  background: rgba(6,9,19,0.7);
  border-bottom: 1px solid var(--bd);
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: none;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  border-radius: 20px;
  padding: 8px 16px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
nav button:hover { border-color: var(--ac); background: var(--card-hover); transform: translateY(-1px); }
nav button.on {
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff;
  border-color: transparent;
  font-weight: 800;
  box-shadow: 0 6px 20px rgba(59,130,246,0.4);
}
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}
.hero {
  margin: 0 0 20px;
  padding: 22px 26px;
  border-radius: 22px;
  color: #fff;
  background: linear-gradient(135deg, #1e293b, #0f172a, #111827);
  border: 1px solid var(--bd);
  box-shadow: 0 12px 35px rgba(0,0,0,0.3);
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute;
  top: -50px; right: -50px;
  width: 150px; height: 150px;
  background: radial-gradient(circle, rgba(0,240,255,0.15), transparent 70%);
  border-radius: 50%;
}
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 22px;
  padding: 24px;
  margin: 18px 0;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  transition: border-color 0.2s;
}
.card:hover { border-color: rgba(59,130,246,0.4); }
.rules { font-size: 13px; color: var(--mu); margin-bottom: 10px; }
input, textarea, select {
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: var(--tx);
  background: rgba(6,9,19,0.8);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 12px 16px;
  margin: 8px 0;
  transition: all 0.2s;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--ac);
  box-shadow: 0 0 0 4px rgba(59,130,246,0.2);
}
textarea { min-height: 120px; resize: vertical; }
button.p {
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff;
  border: 0;
  border-radius: 14px;
  padding: 12px 24px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(59,130,246,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
}
button.p:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59,130,246,0.5); }
button.s {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--bd);
  color: var(--tx);
  border-radius: 14px;
  padding: 10px 18px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
button.s:hover { background: rgba(255,255,255,0.08); border-color: var(--ac); }
button.s.on { background: var(--ac); border-color: transparent; color: #fff; }
button.danger {
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.35);
  color: var(--red);
  border-radius: 12px;
  padding: 8px 14px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.by { font-size: 12px; color: var(--mu); }
.empty { text-align: center; color: var(--mu); padding: 50px 20px; font-weight: 500; font-size: 15px; }
iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 14px; background: #000; }
iframe.g { aspect-ratio: 4/3; background: #fff; width: 100%; border-radius: 14px; border: 1px solid var(--bd); }
.av {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  overflow: hidden;
  flex: none;
  font-size: 26px;
  box-shadow: 0 6px 18px rgba(59,130,246,0.3);
}
#toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  top: 95px;
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff;
  padding: 14px 28px;
  border-radius: 35px;
  font-weight: 700;
  z-index: 9999;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  opacity: 0;
  animation: toastIn 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes toastIn {
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.contact-item { background: rgba(6,9,19,0.5); border: 1px solid var(--bd); padding: 14px 18px; border-radius: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; margin-bottom: 10px; transition: all 0.2s; }
.contact-item:hover { border-color: var(--ac); background: var(--card-hover); transform: translateX(4px); }
pre { background: rgba(6,9,19,0.9); border: 1px solid var(--bd); border-radius: 12px; padding: 14px; overflow-x: auto; font-size: 12px; color: var(--ultra); }
.xp-bar-container { background: rgba(255,255,255,0.06); border-radius: 10px; height: 10px; width: 100%; overflow: hidden; margin: 8px 0; border: 1px solid var(--bd); }
.xp-bar-fill { background: linear-gradient(90deg, var(--ac), var(--ultra)); height: 100%; width: 0%; transition: width 0.4s ease; }
</style>
</head>
<body>

<header>
  <span class="logo">📦 Complete Box</span>
  <span class="online-badge"><span class="online-dot"></span> Online Global</span>
  <div class="wallet-box">
    <span class="currency-pill" id="coins-pill">🪙 0</span>
    <span class="currency-pill ultra" id="ultra-pill">✨ 0</span>
  </div>
</header>

<main>
  <div class="hero">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;">
      <div>
        <h2 style="margin:0 0 4px; font-size:22px;">🌟 Bem-vindo ao Complete Box Supremos!</h2>
        <div style="font-size:13px; opacity:0.9;">O ecossistema definitivo de entretenimento, jogos, IA, chats de voz e missões.</div>
      </div>
      <div id="user-level-badge" style="background:rgba(255,255,255,0.08); border:1px solid var(--bd); padding:8px 16px; border-radius:14px; font-weight:bold; font-size:13px;">
        ⭐ Nível 1 (Novato)
      </div>
    </div>
    <div class="xp-bar-container" style="margin-top:14px;">
      <div class="xp-bar-fill" id="hero-xp-fill"></div>
    </div>
  </div>

  <nav id="nav"></nav>
  <div id="app"></div>
</main>

<script>
function sanitize(input) {
  return typeof input === 'string' ? input : '';
}

let uid = localStorage.getItem('cb_uid');
if (!uid) {
  uid = 'user_' + Math.random().toString(36).substring(2, 9);
  localStorage.setItem('cb_uid', uid);
}

const OWNER_KEY = 'cb_is_pedro_owner';
if (location.hash === '#pedromesquita2026' || localStorage.getItem(OWNER_KEY) === 'true') {
  localStorage.setItem(OWNER_KEY, 'true');
}

let isOwner = localStorage.getItem(OWNER_KEY) === 'true';
let myCoins = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_coins')) || 1000);
let myUltra = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_ultra')) || 50);
let mySavings = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_savings')) || 0);
let myXp = isOwner ? 999999 : (parseInt(localStorage.getItem('cb_xp')) || 0);
let myBadge = localStorage.getItem('cb_badge') || (isOwner ? '👑' : '👤');

let myProfile = {
  name: isOwner ? 'Pedro Mesquita (Dono)' : (localStorage.getItem('cb_name') || 'Visitante_' + uid.slice(-4)),
  badge: myBadge,
  coins: myCoins,
  ultra: myUltra,
  savings: mySavings,
  xp: myXp
};

function getLevelInfo(xp) {
  let level = Math.floor(xp / 500) + 1;
  let nextLevelXp = level * 500;
  let currentLevelXp = xp % 500;
  let percent = Math.min(100, (currentLevelXp / 500) * 100);
  let title = level < 3 ? 'Novato' : level < 6 ? 'Explorador' : level < 10 ? 'Elite' : level < 15 ? 'Mestre' : 'Deus do Complete Box';
  return { level, title, percent };
}

function addXp(amount) {
  if (isOwner) return;
  myProfile.xp += amount;
  localStorage.setItem('cb_xp', myProfile.xp);
  updateHeaderStats();
}

function saveProfile() {
  if (!isOwner) {
    localStorage.setItem('cb_name', myProfile.name);
    localStorage.setItem('cb_coins', myProfile.coins);
    localStorage.setItem('cb_ultra', myProfile.ultra);
    localStorage.setItem('cb_savings', myProfile.savings);
    localStorage.setItem('cb_badge', myProfile.badge);
    localStorage.setItem('cb_xp', myProfile.xp);
  }
}

let allUsers = JSON.parse(localStorage.getItem('cb_all_users') || '{}');
allUsers[uid] = { name: myProfile.name, badge: myProfile.badge, xp: myProfile.xp, coins: myProfile.coins };
localStorage.setItem('cb_all_users', JSON.stringify(allUsers));

function toast(msg) {
  document.querySelectorAll('#toast').forEach(x => x.remove());
  const e = document.createElement('div');
  e.id = 'toast';
  e.textContent = msg;
  document.body.append(e);
  setTimeout(() => e.remove(), 3500);
}

let tab = 'videos';
let completeShopSubTab = 'ofertas';
let missionsSubTab = 'diarias';
let shopCategory = 'coroas';
let currentChatUser = null;
let mediaRecorder = null;
let audioChunks = [];

// Recompensa automática por tempo online (a cada 60s)
let sessionSeconds = 0;
setInterval(() => {
  sessionSeconds++;
  if (sessionSeconds % 60 === 0) {
    if (!isOwner) {
      myProfile.coins += 100;
      addXp(75);
      saveProfile();
    }
    updateHeaderStats();
    toast('⏱️ +100 Moedas & +75 XP por tempo online!');
  }
}, 1000);

let dataList = JSON.parse(localStorage.getItem('cb_datalist') || JSON.stringify({
  videos: [
    { id: 'v1', title: 'Bem-vindo ao Complete Box Definitivo', content: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ', by: 'system', authorName: 'Pedro Mesquita (Dono)', authorBadge: '👑', likes: 120, comments: [], ts: Date.now() }
  ],
  games: [
    { id: 'g1', title: 'Arcade Space Game', content: '<body style="background:#0b0f19;color:#fff;text-align:center;padding-top:40px;font-family:sans-serif;"><h2>🚀 Nave Espacial</h2><canvas id="c" width="300" height="180" style="background:#111;border:2px solid #3b82f6;border-radius:10px;"></canvas><script>const ctx=document.getElementById("c").getContext("2d");let x=150;window.onkeydown=e=>{if(e.key==="ArrowLeft")x-=15;if(e.key==="ArrowRight")x+=15;};function loop(){ctx.clearRect(0,0,300,180);ctx.fillStyle="#00f0ff";ctx.fillRect(x,150,40,15);requestAnimationFrame(loop);}loop();<\/script></body>', by: 'system', authorName: 'Pedro Mesquita (Dono)', authorBadge: '👑', likes: 85, comments: [], ts: Date.now() }
  ],
  pv: {},
  aiMsgs: [
    { role: 'ai', text: 'Olá! Sou a Complete AI Master. Como posso ajudar a revolucionar o seu dia hoje?' }
  ]
}));

function saveData() {
  localStorage.setItem('cb_datalist', JSON.stringify(dataList));
}

const TABS = [
  ['videos', '🎬 Vídeos'],
  ['games', '🎮 Jogos Arcade'],
  ['chat', '💬 PV com Voz'],
  ['completeshop', '🛍️ Complete Shop'],
  ['accessories', '👑 Acessórios'],
  ['speaky', '🗣️ Speaky Voice'],
  ['ai', '🤖 Complete AI'],
  ['missions', '🎯 Missões Supremas'],
  ['leaderboard', '🏆 Ranking Global'],
  ['chest', '🎁 Baú Lendário'],
  ['miner', '⛏️ Mineração Pro'],
  ['spin', '🎡 Roleta Sorte'],
  ['bank', '🏦 Banco & Poupança'],
  ['me', '👤 Meu Perfil']
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeAgo = ts => {
  if (!ts) return 'agora';
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 60) return 'agora';
  if (sec < 3600) return Math.floor(sec/60) + 'm atrás';
  return Math.floor(sec/3600) + 'h atrás';
};

function nav() {
  const el = $('#nav');
  if (el) el.innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('');
}

function go(k) { 
  if (k === 'chat') currentChatUser = null;
  tab = k; 
  nav(); 
  render(); 
}

function updateHeaderStats() {
  const cEl = $('#coins-pill');
  const uEl = $('#ultra-pill');
  const lEl = $('#user-level-badge');
  const xpEl = $('#hero-xp-fill');

  if (cEl) cEl.textContent = isOwner ? '🪙 ∞' : `🪙 ${myProfile.coins}`;
  if (uEl) uEl.textContent = isOwner ? '✨ ∞' : `✨ ${myProfile.ultra}`;
  
  const info = getLevelInfo(myProfile.xp);
  if (lEl) lEl.textContent = `⭐ Nível ${isOwner ? 99 : info.level} (${info.title})`;
  if (xpEl) xpEl.style.width = (isOwner ? 100 : info.percent) + '%';
}

function render() {
  updateHeaderStats();
  const app = $('#app');
  if (!app) return;

  if (tab === 'chat') { 
    if (!currentChatUser) app.innerHTML = contactsListView();
    else { app.innerHTML = chatPVView(currentChatUser); drawPVMessages(currentChatUser); }
    return; 
  }
  if (tab === 'completeshop') { app.innerHTML = completeShopView(); return; }
  if (tab === 'accessories') { app.innerHTML = accessoriesView(); return; }
  if (tab === 'speaky') { app.innerHTML = speakyDedView(); return; }
  if (tab === 'ai') { app.innerHTML = aiView(); drawAIMessages(); return; }
  if (tab === 'missions') { app.innerHTML = missionsView(); return; }
  if (tab === 'leaderboard') { app.innerHTML = leaderboardView(); return; }
  if (tab === 'chest') { app.innerHTML = chestView(); return; }
  if (tab === 'miner') { app.innerHTML = minerView(); return; }
  if (tab === 'spin') { app.innerHTML = spinView(); return; }
  if (tab === 'bank') { app.innerHTML = bankView(); return; }
  if (tab === 'me') { app.innerHTML = profileView(); return; }

  let titles = { videos: '🎬 Publicar Vídeo na Rede Global', games: '🎮 Publicar Jogo Arcade HTML' };
  app.innerHTML = `
    <div class="card">
      <b style="font-size:18px;">${titles[tab] || 'Publicar'}</b>
      <p class="rules">Compartilhe conteúdos de alta qualidade para ganhar engajamento e XP.</p>
      <input id="p-title" placeholder="Título chamativo" maxlength="100">
      ${tab === 'games' ? '<textarea id="p-content" placeholder="Cole o código HTML completo do seu jogo arcade aqui..."></textarea>' : '<input id="p-content" placeholder="Link do YouTube ou URL direta (.mp4)">'}
      <button class="p" style="margin-top:14px; width:100%;" onclick="submitPost('${tab}')">🚀 Publicar e Ganhar XP</button>
    </div>
    <div id="content-list"></div>
  `;
  renderContentList(tab);
}

// --- RANKING GLOBAL ---
function leaderboardView() {
  let users = JSON.parse(localStorage.getItem('cb_all_users') || '{}');
  users[uid] = { name: myProfile.name, badge: myProfile.badge, xp: myProfile.xp, coins: myProfile.coins };
  
  let sorted = Object.values(users).sort((a, b) => (b.xp || 0) - (a.xp || 0));

  return `
    <div class="card">
      <b style="font-size:20px;">🏆 Placar de Líderes Global</b>
      <p class="rules">Os usuários mais ativos e poderosos da rede Complete Box.</p>
      <div style="margin-top:16px; display:flex; flex-direction:column; gap:10px;">
        ${sorted.map((u, index) => `
          <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(6,9,19,0.7); border:1px solid var(--bd); padding:14px 18px; border-radius:16px;">
            <div class="row">
              <span style="font-weight:900; font-size:16px; width:28px; color:${index===0?'var(--gold)':index===1?'var(--mu)':index===2?'#b45309':'var(--tx)'}">#${index+1}</span>
              <span class="av" style="width:40px; height:40px; font-size:16px;">${esc(u.badge || '👤')}</span>
              <div>
                <b style="font-size:15px;">${esc(u.name)}</b>
                <div class="by">Nível ${Math.floor((u.xp || 0)/500)+1}</div>
              </div>
            </div>
            <div style="text-align:right; font-weight:bold; color:var(--ultra);">
              ⭐ ${u.xp || 0} XP
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// --- COMPLETE SHOP ---
function completeShopView() {
  return `
    <div class="card row" style="gap:6px; background: rgba(15,23,42,0.9);">
      <button class="s ${completeShopSubTab==='ofertas'?'on':''}" onclick="completeShopSubTab='ofertas'; render();">🔥 Pacotes Supreme</button>
      <button class="s ${completeShopSubTab==='trocas'?'on':''}" onclick="completeShopSubTab='trocas'; render();">🔄 Câmbio Rápido</button>
      <button class="s ${completeShopSubTab==='halloween'?'on':''}" onclick="completeShopSubTab='halloween'; render();">✨ Baú Especial</button>
      <button class="s ${completeShopSubTab==='baus'?'on':''}" onclick="completeShopSubTab='baus'; render();">🎁 Cofre Lendário</button>
    </div>

    ${completeShopSubTab === 'ofertas' ? `
      <div class="card" style="border: 2px solid var(--ultra);">
        <div class="row" style="justify-content:space-between;">
          <b style="color:var(--ultra); font-size:18px;">✨ Pacote Mega Supreme Ultra</b>
          <span style="background:rgba(16,185,129,0.2); color:var(--green); padding:4px 10px; border-radius:10px; font-size:12px; font-weight:bold;">OFERTA IMPERDÍVEL</span>
        </div>
        <div style="font-size:42px; text-align:center; margin:18px 0;">✨ 25 Ultra Complete Coins</div>
        <p class="rules" style="text-align:center;">Adquira créditos de elite na Complete Shop para desbloquear itens exclusivos instantaneamente.</p>
        <button class="p" style="width:100%; background:linear-gradient(135deg, var(--ac), var(--ultra)); color:#000; font-weight:900;" onclick="buyUltraPackage(25, 300000)">Comprar por 🪙 300.000 Moedas</button>
      </div>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:14px;">
        <div class="card" style="text-align:center;">
          <div style="font-size:26px;">✨ 8 Ultra</div>
          <div style="color:var(--gold); margin:8px 0;">🪙 100.000 Moedas</div>
          <button class="p" style="width:100%; padding:8px;" onclick="buyUltraPackage(8, 100000)">Comprar</button>
        </div>
        <div class="card" style="text-align:center;">
          <div style="font-size:26px;">✨ 50 Ultra</div>
          <div style="color:var(--gold); margin:8px 0;">🪙 600.000 Moedas</div>

function drawPVMessages(targetUid) {
  const m = $('#pv-msgs');
  if (!m) return;
  if (!dataList.pv) dataList.pv = {};

  let msgs = dataList.pv[chatKey] || [];

  if (msgs.length === 0) {

    return;
  }

  m.innerHTML = msgs.map(x => {

    let contentHtml = x.type === 'audio' ? `<audio controls src="${x.audioUrl}" style="max-width:240px; height:36px;"></audio>` : `<div style="font-size:14px; word-break:break-word;">${esc(x.text)}</div>`;

}

function sendPVMessage(targetUid) {
  const input = $('#pv-input');
  if (!input || !input.value.trim()) return;
  const text = input.value.trim();
  input.value = '';

  if (!dataList.pv) dataList.pv = {};
  let chatKey = [uid, targetUid].sort().join('_');
  if (!dataList.pv[chatKey]) dataList.pv[chatKey] = [];

  dataList.pv[chatKey].push({ sender: uid, type: 'text', text, ts: Date.now() });
  addXp(15);
  saveData();
  drawPVMessages(targetUid);
}

function toggleAudioRecording(targetUid) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return toast('❌ Navegador não suporta gravação de áudio.');
  }

  if (!mediaRecorder || mediaRecorder.state === 'inactive') {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
        const audioUrl = URL.createObjectURL(audioBlob);

        if (!dataList.pv) dataList.pv = {};
        let chatKey = [uid, targetUid].sort().join('_');
        if (!dataList.pv[chatKey]) dataList.pv[chatKey] = [];

        dataList.pv[chatKey].push({ sender: uid, type: 'audio', audioUrl, ts: Date.now() });
        addXp(30);
        saveData();
        drawPVMessages(targetUid);
        toast('🎤 Mensagem de voz enviada com sucesso!');
      };

      mediaRecorder.start();
      $('#mic-btn').style.background = 'var(--red)';
      toast('🔴 Gravando áudio... Clique novamente para parar.');
    }).catch(() => toast('❌ Permissão de microfone negada.'));
  } else {
    mediaRecorder.stop();
    $('#mic-btn').style.background = '';
  }
}

  drawAIMessages();

  setTimeout(() => {
    let reply = "Compreendido perfeitamente! Acesse a aba de Missões para coletar suas recompensas.";
    const lower = q.toLowerCase();
    if (lower.includes('olá') || lower.includes('oi')) reply = "Olá! É um prazer ter você na rede Complete Box. Como posso ajudar?";
    else if (lower.includes('loja')) reply = "A Complete Shop está repleta de pacotes incríveis de Ultra Coins!";
    else if (lower.includes('dono')) reply = "O criador supremo e Visionário do Complete Box é o Pedro Mesquita!";
    
    dataList.aiMsgs.push({ role: 'ai', text: reply });
    saveData();
    drawAIMessages();
  }, 600);
}

function generateAIGame() {
  const input = $('#ai-game-prompt');
  if (!input) return;
  const prompt = input.value.trim();
  if (!prompt) return toast('Digite uma ideia para o jogo arcade!');
  toast('⏳ IA gerando código do jogo arcade...');
  
  setTimeout(() => {
    const code = `<!DOCTYPE html><html><head><style>body{margin:0;background:#0b0f19;color:#fff;text-align:center;font-family:sans-serif;}canvas{background:#111;border:2px solid #3b82f6;margin-top:10px;border-radius:10px;}</style></head><body><h3>🎮 ${prompt}</h3><canvas id="c" width="320" height="200"></canvas><p>Pontos: <b id="s">0</b></p><script>const c=document.getElementById('c'),x=c.getContext('2d');let score=0,py=140,vy=0,ox=320;window.onclick=()=>{if(py>=140)vy=-8;};function loop(){vy+=0.4;py+=vy;if(py>140){py=140;vy=0;}ox-=4;if(ox<-20){ox=320;score+=10;document.getElementById('s').textContent=score;}x.clearRect(0,0,320,200);x.fillStyle='#3b82f6';x.fillRect(40,py,20,20);x.fillStyle='#00f0ff';x.fillRect(ox,140,20,20);requestAnimationFrame(loop);}loop();<\/script></body></html>`;
    dataList.aiMsgs.push({ role: 'ai', text: `Jogo arcade "${prompt}" gerado com sucesso!`, code, gameTitle: prompt });
    addXp(100);
    saveData();
    drawAIMessages();
    toast('✨ Jogo arcade gerado com sucesso!');
  }, 1000);
}

function publishAIGame(title) {
  const lastMsg = [...dataList.aiMsgs].reverse().find(m => m.code);
  if (!lastMsg) return;
  const postObj = { id: 'g_' + Math.random().toString(36).substring(2, 9), title: 'Arcade IA: ' + title, content: lastMsg.code, by: uid, authorName: myProfile.name, authorBadge: myProfile.badge, likes: 0, comments: [], ts: Date.now() };
  dataList.games.unshift(postObj);
  addXp(150);
  saveData();
  toast('🎮 Jogo publicado na comunidade global!');
  go('games');
}

// --- BAÚ 1H ---
function chestView() {
  const lastChest = parseInt(localStorage.getItem('cb_last_chest') || '0');
  const now = Date.now();
  const diff = now - lastChest;
  const oneHour = 3600000;
  const canClaim = diff >= oneHour;
  const timeLeft = canClaim ? 0 : Math.ceil((oneHour - diff) / 60000);

  return `
    <div class="card" style="text-align:center; padding:40px 20px;">
      <b style="font-size:24px;">🎁 Baú Misterioso de 1 Hora</b>
      <p class="rules" style="margin-top:10px;">Volte a cada 1 hora exata para abrir seu baú de recompensas gratuitas!</p>
      <div style="font-size:80px; margin:26px 0;">📦</div>
      <div style="margin-bottom:22px; font-weight:bold; font-size:17px; color:var(--gold);">
        ${canClaim ? '✨ Baú Disponível para Resgate!' : `⏳ Próximo baú em ${timeLeft} minutos.`}
      </div>
      <button class="p" style="padding:14px 34px; font-size:16px;" ${canClaim ? '' : 'disabled style="opacity:0.5; cursor:not-allowed;"'} onclick="claimChest()">Abrir Baú 🔓</button>
    </div>
  `;
}

function claimChest() {
  const lastChest = parseInt(localStorage.getItem('cb_last_chest') || '0');
  const now = Date.now();
  if (now - lastChest < 3600000) return toast('Recarga de 1h em andamento!');
  localStorage.setItem('cb_last_chest', now);
  const reward = Math.floor(Math.random() * 120) + 60;
  if (!isOwner) { myProfile.coins += reward; addXp(80); saveProfile(); }
  updateHeaderStats(); 
  render();
  toast(`🎉 +${reward} moedas e +80 XP no baú!`);
}

let minerClicks = 0;
function minerView() {
  return `
    <div class="card" style="text-align:center; padding:40px 20px;">
      <b style="font-size:24px;">⛏️ Mineração Pro de Moedas</b>
      <p class="rules">Clique rapidamente no bloco energético abaixo para farmar moedas e XP!</p>
      <div style="margin:30px auto; width:150px; height:150px; background:linear-gradient(135deg, var(--ac), var(--ultra)); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:55px; cursor:pointer; box-shadow: 0 10px 30px rgba(0,240,255,0.3); transition: transform 0.1s;" onclick="clickMiner()">✨</div>
      <div style="font-size:17px; color:var(--gold);">Moedas mineradas: <b id="mc">${minerClicks}</b></div>
    </div>
  `;
}
function clickMiner() {
  minerClicks++;
  const el = $('#mc'); if(el) el.textContent = minerClicks;
  if(!isOwner && minerClicks % 8 === 0) { 
    myProfile.coins += 10; 
    addXp(15);
    saveProfile(); 
    updateHeaderStats(); 
    toast('⚡ +10 moedas e +15 XP minerados!'); 
  }
}

function spinView() {
  return `
    <div class="card" style="text-align:center; padding:40px 20px;">
      <b style="font-size:24px;">🎡 Roleta da Sorte Diária</b>
      <div id="sp-txt" style="color:var(--gold); font-size:24px; font-weight:800; margin:26px 0; padding:18px; background:rgba(6,9,19,0.8); border:2px dashed var(--ac); border-radius:16px;">GIRO DIÁRIO PRONTO</div>
      <button class="p" style="padding:14px 30px;" onclick="doSpin()">Girar Roleta 🎰</button>
    </div>
  `;
}
function doSpin() {
  const d = new Date().toDateString();
  if(localStorage.getItem('cb_spin') === d) return toast('Você já girou a roleta hoje!');
  localStorage.setItem('cb_spin', d);
  const w = [50, 100, 250, 500][Math.floor(Math.random()*4)];
  $('#sp-txt').textContent = `🎉 +${w} Moedas Ganhas!`;
  if(!isOwner) { myProfile.coins += w; addXp(120); saveProfile(); }
  updateHeaderStats(); 
  toast(`🎉 Parabéns! Ganhou ${w} moedas e +120 XP!`);
}

function bankView() {
  return `
    <div class="card">
      <b style="font-size:20px;">🏦 Banco & Poupança Global</b>
      <div style="background:rgba(6,9,19,0.8); border:1px solid var(--bd); border-radius:16px; padding:18px; margin: 18px 0;">
        <div style="font-size:14px; color:var(--mu);">Carteira Disponível: <b>🪙 ${isOwner ? '∞' : myProfile.coins}</b></div>
        <div style="font-size:16px; margin-top:6px; color:var(--gold);">Poupança Segura: <b>🪙 ${isOwner ? '∞' : myProfile.savings}</b></div>
      </div>
      <input id="bk-amt" type="number" placeholder="Quantidade de moedas" min="1">
      <div class="row" style="margin-top:12px;">
        <button class="p" style="flex:1;" onclick="dep()">Depositar na Poupança 📥</button>
        <button class="s" style="flex:1;" onclick="wit()">Sacar para Carteira 📤</button>
      </div>
    </div>
  `;
}
function dep() {
  const v = parseInt($('#bk-amt').value);
  if(!v || v <= 0 || myProfile.coins < v) return toast('Saldo insuficiente na carteira!');
  myProfile.coins -= v; myProfile.savings += v; addXp(40); saveProfile(); updateHeaderStats(); render(); toast('Depositado com sucesso!');
}
function wit() {
  const v = parseInt($('#bk-amt').value);
  if(!v || v <= 0 || myProfile.savings < v) return toast('Saldo insuficiente na poupança!');
  myProfile.savings -= v; myProfile.coins += v; saveProfile(); updateHeaderStats(); render(); toast('Sacado com sucesso!');
}

// --- PERFIL ---
function profileView() {
  const myVideos = (dataList.videos || []).filter(x => x.by === uid);
  const myGames = (dataList.games || []).filter(x => x.by === uid);
  const info = getLevelInfo(myProfile.xp);

  return `
    <div class="card" style="text-align:center; padding:40px 20px;">
      <span class="av" style="width:90px; height:90px; font-size:38px; margin-bottom:12px;">${myProfile.badge}</span>
      <h2 style="margin:4px 0 2px; font-size:26px;">${esc(myProfile.name)}</h2>
      <div class="by">${isOwner ? '👑 Administrador Supremo / Dono' : `👤 Nível ${info.level} (${info.title})`}</div>
      <div class="row" style="justify-content:center; gap:24px; margin-top:22px; border-top:1px solid var(--bd); border-bottom:1px solid var(--bd); padding:16px 0;">
        <div><b style="font-size:16px;">${myVideos.length + myGames.length}</b><div class="by">Posts</div></div>
        <div><b style="font-size:16px;">🪙 ${isOwner ? '∞' : myProfile.coins}</b><div class="by">Moedas</div></div>
        <div><b style="font-size:16px;">✨ ${isOwner ? '∞' : myProfile.ultra}</b><div class="by">Ultra</div></div>
        <div><b style="font-size:16px;">⭐ ${isOwner ? '∞' : myProfile.xp}</b><div class="by">XP Total</div></div>
      </div>
    </div>
    <div class="card">
      <b style="font-size:18px;">⚙️ Configurações da Conta</b>
      ${isOwner ? '<p class="rules" style="margin-top:6px;">Modo Dono Supremo Ativo.</p>' : `
        <input id="new-name" value="${esc(myProfile.name)}" placeholder="Seu nome global">
        <button class="p" style="margin-top:10px;" onclick="myProfile.name=sanitize($('#new-name').value); saveProfile(); toast('Nome alterado com sucesso!'); render();">Salvar Nome</button>
        <hr style="border:0; border-top:1px solid var(--bd); margin:20px 0;">
        <input id="op-pass" type="password" placeholder="Senha secreta do Dono">
        <button class="s" style="margin-top:6px; width:100%;" onclick="if($('#op-pass').value==='dono-pedro-2026'){localStorage.setItem('${OWNER_KEY}','true');location.reload();}else{toast('Senha incorreta!');}">Ativar Modo Dono 👑</button>
      `}
    </div>
    <div class="card">
      <b style="font-size:18px;">📸 Suas Publicações Globais</b>
      <div style="margin-top:16px;">
        ${!myVideos.length && !myGames.length ? '<div class="empty">Nenhuma publicação feita ainda.</div>' : ''}
        ${myVideos.map(x => `
          <div style="background:rgba(6,9,19,0.8); border:1px solid var(--bd); border-radius:18px; padding:18px; margin-bottom:18px;">
            <div class="row" style="justify-content:space-between; margin-bottom:12px;">
              <b>🎬 Vídeo: ${esc(x.title)}</b>
              <button class="danger" onclick="deletePost('videos', '${x.id}')">Apagar</button>
            </div>
            <div><iframe src="https://www.youtube.com/embed/${(x.content.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||[])[1]||''}" allowfullscreen></iframe></div>
          </div>
        `).join('')}
        ${myGames.map(x => `
          <div style="background:rgba(6,9,19,0.8); border:1px solid var(--bd); border-radius:18px; padding:18px; margin-bottom:18px;">
            <div class="row" style="justify-content:space-between; margin-bottom:12px;">
              <b>🎮 Jogo: ${esc(x.title)}</b>
              <button class="danger" onclick="deletePost('games', '${x.id}')">Apagar</button>
            </div>
            <div style="margin-top:8px;"><iframe class="g" srcdoc="${x.content}"></iframe></div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function submitPost(kind) {
  const t = sanitize($('#p-title').value);
  const c = $('#p-content').value;
  if(!t || !c) return toast('Preencha todos os campos!');
  const postObj = { id: 'p_' + Math.random().toString(36).substring(2, 9), title: t, content: c, by: uid, authorName: myProfile.name, authorBadge: myProfile.badge, likes: 0, comments: [], ts: Date.now() };
  dataList[kind].unshift(postObj);
  addXp(200);
  saveData();
  toast('Publicado com sucesso e +200 XP!');
  go(kind);
}

function deletePost(kind, id) {
  if (confirm('Deseja realmente apagar esta publicação?')) {
    dataList[kind] = dataList[kind].filter(x => x.id !== id);
    saveData();
    toast('Publicação apagada!');
    render();
  }
}

function likePost(kind, id) {
  const item = (dataList[kind] || []).find(x => x.id === id);
  if (item) {
    item.likes = (item.likes || 0) + 1;
    addXp(10);
    saveData();
    renderContentList(kind);
    toast('❤️ Curtido! +10 XP');
  }
}

function addComment(kind, id) {
  const input = $(`#comment-input-${id}`);
  if (!input || !input.value.trim()) return;
  const item = (dataList[kind] || []).find(x => x.id === id);
  if (item) {
    if (!item.comments) item.comments = [];
    item.comments.push({ author: myProfile.name, text: sanitize(input.value.trim()), ts: Date.now() });
    addXp(15);
    saveData();
    renderContentList(kind);
    toast('💬 Comentário enviado! +15 XP');
  }
}

function renderContentList(k) {
  const box = $('#content-list'); if(!box) return;
  const items = dataList[k] || [];
  if (!items.length) { box.innerHTML = '<div class="empty">Nenhum conteúdo publicado nesta categoria.</div>'; return; }

  box.innerHTML = items.map(x => {
    let body = '';
    if (k === 'videos') {
      const ytMatch = x.content.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
      body = ytMatch ? `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen></iframe>` : `<a href="${esc(x.content)}" target="_blank" style="color:var(--ac)">🔗 ${esc(x.content)}</a>`;
    } else if (k === 'games') {
      body = `<div style="background:#000; border-radius:14px; padding:6px;"><iframe class="g" srcdoc="${x.content}"></iframe></div>`;
    }
    const canDelete = isOwner || x.by === uid;
    const commentsList = (x.comments || []).map(cm => `
      <div style="background:rgba(6,9,19,0.5); border:1px solid var(--bd); padding:8px 12px; border-radius:10px; margin-top:6px; font-size:13px;">
        <b>${esc(cm.author)}:</b> ${esc(cm.text)}
      </div>
    `).join('');

    return `
      <div class="card">
        <div class="row" style="margin-bottom:14px; justify-content:space-between;">
          <div class="row">
            <span class="av" style="width:44px; height:44px; font-size:18px;">${esc(x.authorBadge || '👤')}</span>
            <div><b>${esc(x.authorName)}</b><div class="by">${timeAgo(x.ts)}</div></div>
          </div>
          ${canDelete ? `<button class="danger" onclick="deletePost('${k}', '${x.id}')">Apagar</button>` : ''}
        </div>
        <h3 style="margin:8px 0 14px; font-size:19px;">${esc(x.title)}</h3>
        ${body}
        <div class="row" style="margin-top:14px; gap:12px;">
          <button class="s" onclick="likePost('${k}', '${x.id}')">❤️ Curtir (${x.likes || 0})</button>
        </div>
        <div style="margin-top:14px; border-top:1px solid var(--bd); padding-top:12px;">
          <div class="row">
            <input id="comment-input-${x.id}" placeholder="Escreva um comentário..." style="flex:1; margin:0;" onkeydown="if(event.key==='Enter')addComment('${k}', '${x.id}')">
            <button class="p" style="padding:10px 16px;" onclick="addComment('${k}', '${x.id}')">Comentar</button>
          </div>
          <div style="margin-top:8px;">${commentsList}</div>
        </div>
      </div>
    `;
  }).join('');
}

window.addEventListener('DOMContentLoaded', () => {
  nav();
  render();
});
</script>
</body>
</html>
