<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complete Box</title>
<style>
:root {
  --bg: #010409;
  --card: #0d1117;
  --card-hover: #161b22;
  --tx: #f0f6fc;
  --mu: #8b949e;
  --ac: #2563eb;
  --ac2: #7c3aed;
  --bd: #30363d;
  --gold: #f59e0b;
  --ultra: #00f0ff;
  --green: #238636;
  --red: #da3633;
  --pink: #db61a2;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(circle at 50% -20%, rgba(37,99,235,0.25), transparent 60%), radial-gradient(circle at 50% 120%, rgba(124,58,237,0.2), transparent 70%), var(--bg);
  color: var(--tx);
  font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(1,4,9,0.92);
  backdrop-filter: blur(25px);
  border-bottom: 1px solid var(--bd);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo {
  font-weight: 900;
  font-size: 24px;
  background: linear-gradient(90deg, #3b82f6, #00f0ff, #8b5cf6);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -0.5px;
}
.online-badge {
  font-size: 11px;
  background: rgba(35,134,54,0.15);
  color: #3fb950;
  border: 1px solid rgba(35,134,54,0.4);
  padding: 4px 10px;
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
}
.online-dot {
  width: 7px;
  height: 7px;
  background: #3fb950;
  border-radius: 50%;
  box-shadow: 0 0 12px #3fb950;
}
.wallet-box {
  margin-left: auto;
  display: flex;
  gap: 8px;
  align-items: center;
}
.currency-pill {
  font-weight: 800;
  background: rgba(245,158,11,0.12);
  border: 1px solid rgba(245,158,11,0.35);
  color: #fbbf24;
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  box-shadow: 0 4px 15px rgba(245,158,11,0.15);
}
.currency-pill.ultra {
  background: rgba(0,240,255,0.12);
  border-color: rgba(0,240,255,0.35);
  color: var(--ultra);
  box-shadow: 0 4px 15px rgba(0,240,255,0.15);
}
nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 24px;
  scrollbar-width: none;
  background: rgba(1,4,9,0.8);
  border-bottom: 1px solid var(--bd);
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: none;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  border-radius: 20px;
  padding: 8px 16px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
nav button:hover { border-color: var(--ac); background: var(--card-hover); transform: translateY(-1px); }
nav button.on {
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff;
  border-color: transparent;
  font-weight: 800;
  box-shadow: 0 6px 20px rgba(37,99,235,0.4);
}
main {
  max-width: 940px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}
.hero {
  margin: 0 0 20px;
  padding: 24px 28px;
  border-radius: 24px;
  color: #fff;
  background: linear-gradient(135deg, #161b22, #0d1117, #010409);
  border: 1px solid var(--bd);
  box-shadow: 0 15px 40px rgba(0,0,0,0.5);
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(0,240,255,0.25), transparent 70%);
  border-radius: 50%;
}
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 24px;
  padding: 24px;
  margin: 18px 0;
  box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  transition: border-color 0.25s, transform 0.25s;
}
.card:hover { border-color: rgba(59,130,246,0.6); }
.rules { font-size: 13px; color: var(--mu); margin-bottom: 10px; }
input, textarea, select {
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: var(--tx);
  background: rgba(1,4,9,0.95);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 12px 16px;
  margin: 8px 0;
  transition: all 0.2s;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--ac);
  box-shadow: 0 0 0 4px rgba(37,99,235,0.3);
}
textarea { min-height: 120px; resize: vertical; }
button.p {
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff;
  border: 0;
  border-radius: 14px;
  padding: 12px 24px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(37,99,235,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
}
button.p:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37,99,235,0.6); }
button.s {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--bd);
  color: var(--tx);
  border-radius: 14px;
  padding: 10px 18px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
button.s:hover { background: rgba(255,255,255,0.08); border-color: var(--ac); }
button.s.on { background: var(--ac); border-color: transparent; color: #fff; }
button.danger {
  background: rgba(218,54,51,0.15);
  border: 1px solid rgba(218,54,51,0.4);
  color: #ff7b72;
  border-radius: 12px;
  padding: 8px 14px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}
button.danger:hover { background: rgba(218,54,51,0.3); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.by { font-size: 12px; color: var(--mu); }
.empty { text-align: center; color: var(--mu); padding: 50px 20px; font-weight: 500; font-size: 15px; }
iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 16px; background: #000; }
iframe.g { aspect-ratio: 4/3; background: #fff; width: 100%; border-radius: 16px; border: 1px solid var(--bd); }
.av {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  overflow: hidden;
  flex: none;
  font-size: 26px;
  box-shadow: 0 6px 18px rgba(37,99,235,0.4);
}
#toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  top: 95px;
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff;
  padding: 14px 28px;
  border-radius: 35px;
  font-weight: 700;
  z-index: 9999;
  box-shadow: 0 15px 40px rgba(0,0,0,0.7);
  opacity: 0;
  animation: toastIn 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes toastIn {
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.contact-item { background: rgba(1,4,9,0.7); border: 1px solid var(--bd); padding: 14px 18px; border-radius: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; margin-bottom: 10px; transition: all 0.2s; }
.contact-item:hover { border-color: var(--ac); background: var(--card-hover); transform: translateX(4px); }
pre { background: rgba(1,4,9,0.95); border: 1px solid var(--bd); border-radius: 14px; padding: 14px; overflow-x: auto; font-size: 12px; color: var(--ultra); }
.xp-bar-container { background: rgba(255,255,255,0.06); border-radius: 10px; height: 10px; width: 100%; overflow: hidden; margin: 8px 0; border: 1px solid var(--bd); }
.xp-bar-fill { background: linear-gradient(90deg, var(--ac), var(--ultra)); height: 100%; width: 0%; transition: width 0.4s ease; }
</style>
</head>
<body>

<header>
  <span class="logo">Complete Box</span>
  <span class="online-badge"><span class="online-dot"></span> Online Global</span>
  <div class="wallet-box">
    <span class="currency-pill" id="coins-pill">🪙 0</span>
    <span class="currency-pill ultra" id="ultra-pill">✨ 0</span>
  </div>
</header>

<main>
  <div class="hero">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;">
      <div>
        <h2 style="margin:0 0 4px; font-size:22px;">Complete Box - Quantum Supreme Master</h2>
        <div style="font-size:13px; opacity:0.9;">O ápice mundial em jogos, inteligência artificial neural, chats de voz e missões.</div>
      </div>
      <div id="user-level-badge" style="background:rgba(255,255,255,0.08); border:1px solid var(--bd); padding:8px 16px; border-radius:14px; font-weight:bold; font-size:13px;">
        ⭐ Nível 1 (Novato)
      </div>
    </div>
    <div class="xp-bar-container" style="margin-top:14px;">
      <div class="xp-bar-fill" id="hero-xp-fill"></div>
    </div>
  </div>

  <nav id="nav"></nav>
  <div id="app"></div>
</main>

<script>
function sanitize(input) {
  return typeof input === 'string' ? input : '';
}

let uid = localStorage.getItem('cb_uid');
if (!uid) {
  uid = 'user_' + Math.random().toString(36).substring(2, 9);
  localStorage.setItem('cb_uid', uid);
}

const OWNER_KEY = 'cb_is_pedro_owner';
if (location.hash === '#pedromesquita2026' || localStorage.getItem(OWNER_KEY) === 'true') {
  localStorage.setItem(OWNER_KEY, 'true');
}

let isOwner = localStorage.getItem(OWNER_KEY) === 'true';
let myCoins = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_coins')) || 2000);
let myUltra = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_ultra')) || 100);
let mySavings = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_savings')) || 0);
let myXp = isOwner ? 999999 : (parseInt(localStorage.getItem('cb_xp')) || 0);
let myBadge = localStorage.getItem('cb_badge') || (isOwner ? '👑' : '👤');

let myProfile = {
  name: isOwner ? 'Pedro Mesquita (Dono)' : (localStorage.getItem('cb_name') || 'Visitante_' + uid.slice(-4)),
  badge: myBadge,
  coins: myCoins,
  ultra: myUltra,
  savings: mySavings,
  xp: myXp
};

function getLevelInfo(xp) {
  let level = Math.floor(xp / 500) + 1;
  let currentLevelXp = xp % 500;
  let percent = Math.min(100, (currentLevelXp / 500) * 100);
  let title = level < 3 ? 'Novato' : level < 6 ? 'Explorador' : level < 10 ? 'Elite' : level < 15 ? 'Mestre' : 'Deus do Complete Box';
  return { level, title, percent };
}

function addXp(amount) {
  if (isOwner) return;
  myProfile.xp += amount;
  localStorage.setItem('cb_xp', myProfile.xp);
  updateHeaderStats();
}

function saveProfile() {
  if (!isOwner) {
    localStorage.setItem('cb_name', myProfile.name);
    localStorage.setItem('cb_coins', myProfile.coins);
    localStorage.setItem('cb_ultra', myProfile.ultra);
    localStorage.setItem('cb_savings', myProfile.savings);
    localStorage.setItem('cb_badge', myProfile.badge);
    localStorage.setItem('cb_xp', myProfile.xp);
  }
}

let allUsers = JSON.parse(localStorage.getItem('cb_all_users') || '{}');
allUsers[uid] = { name: myProfile.name, badge: myProfile.badge, xp: myProfile.xp, coins: myProfile.coins };
localStorage.setItem('cb_all_users', JSON.stringify(allUsers));

function toast(msg) {
  document.querySelectorAll('#toast').forEach(x => x.remove());
  const e = document.createElement('div');
  e.id = 'toast';
  e.textContent = msg;
  document.body.append(e);
  setTimeout(() => e.remove(), 3500);
}

let tab = 'videos';
let completeShopSubTab = 'ofertas';
let missionsSubTab = 'diarias';
let shopCategory = 'coroas';
let currentChatUser = null;
let mediaRecorder = null;
let audioChunks = [];

let sessionSeconds = 0;
setInterval(() => {
  sessionSeconds++;
  if (sessionSeconds % 60 === 0) {
    if (!isOwner) {
      myProfile.coins += 150;
      addXp(100);
      saveProfile();
    }
    updateHeaderStats();
    toast('⏱️ +150 Moedas & +100 XP por tempo online!');
  }
}, 1000);

let dataList = JSON.parse(localStorage.getItem('cb_datalist') || JSON.stringify({
  videos: [
    { id: 'v1', title: 'Lançamento Global do Complete Box Quantum', content: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ', by: 'system', authorName: 'Pedro Mesquita (Dono)', authorBadge: '👑', likes: 450, comments: [], ts: Date.now() }
  ],
  games: [
    { id: 'g1', title: 'Cyber Quantum Arcade', content: '<body style="background:#010409;color:#fff;text-align:center;padding-top:40px;font-family:sans-serif;"><h2>🚀 Nave Quantum</h2><canvas id="c" width="300" height="180" style="background:#111;border:2px solid #3b82f6;border-radius:12px;"></canvas><script>const ctx=document.getElementById("c").getContext("2d");let x=150;window.onkeydown=e=>{if(e.key==="ArrowLeft")x-=15;if(e.key==="ArrowRight")x+=15;};function loop(){ctx.clearRect(0,0,300,180);ctx.fillStyle="#00f0ff";ctx.fillRect(x,150,40,15);requestAnimationFrame(loop);}loop();<\/script></body>', by: 'system', authorName: 'Pedro Mesquita (Dono)', authorBadge: '👑', likes: 230, comments: [], ts: Date.now() }
  ],
  pv: {},
  aiMsgs: [
    { role: 'ai', text: 'Olá! Sou a Complete AI Quantum Master. Todos os meus sistemas neurais estão otimizados ao máximo. Como posso ajudar?' }
  ]
}));

function saveData() {
  localStorage.setItem('cb_datalist', JSON.stringify(dataList));
}

const TABS = [
  ['videos', '🎬 Vídeos'],
  ['games', '🎮 Jogos Arcade'],
  ['chat', '💬 PV com Voz'],
  ['completeshop', '🛍️ Complete Shop'],
  ['accessories', '👑 Acessórios'],
  ['speaky', '🗣️ Speaky Voice'],
  ['ai', '🤖 Complete AI Master'],
  ['missions', '🎯 Missões Supremas'],
  ['leaderboard', '🏆 Ranking Global'],
  ['chest', '🎁 Baú Lendário'],
  ['miner', '⛏️ Mineração Pro'],
  ['spin', '🎡 Roleta Sorte'],
  ['bank', '🏦 Banco & Poupança'],
  ['me', '👤 Meu Perfil']
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeAgo = ts => {
  if (!ts) return 'agora';
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 60) return 'agora';
  if (sec < 3600) return Math.floor(sec/60) + 'm atrás';
  return Math.floor(sec/3600) + 'h atrás';
};

function nav() {
  const el = $('#nav');
  if (el) el.innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('');
}

function go(k) { 
  if (k === 'chat') currentChatUser = null;
  tab = k; 
  nav(); 
  render(); 
}

function updateHeaderStats() {
  const cEl = $('#coins-pill');
  const uEl = $('#ultra-pill');
  const lEl = $('#user-level-badge');
  const xpEl = $('#hero-xp-fill');

  if (cEl) cEl.textContent = isOwner ? '🪙 ∞' : `🪙 ${myProfile.coins}`;
  if (uEl) uEl.textContent = isOwner ? '✨ ∞' : `✨ ${myProfile.ultra}`;
  
  const info = getLevelInfo(myProfile.xp);
  if (lEl) lEl.textContent = `⭐ Nível ${isOwner ? 99 : info.level} (${info.title})`;
  if (xpEl) xpEl.style.width = (isOwner ? 100 : info.percent) + '%';
}

function render() {
  updateHeaderStats();
  const app = $('#app');
  if (!app) return;

  if (tab === 'chat') { 
    if (!currentChatUser) app.innerHTML = contactsListView();
    else { app.innerHTML = chatPVView(currentChatUser); drawPVMessages(currentChatUser); }
    return; 
  }
  if (tab === 'completeshop') { app.innerHTML = completeShopView(); return; }
  if (tab === 'accessories') { app.innerHTML = accessoriesView(); return; }
  if (tab === 'speaky') { app.innerHTML = speakyDedView(); return; }
  if (tab === 'ai') { app.innerHTML = aiView(); drawAIMessages(); return; }
  if (tab === 'missions') { app.innerHTML = missionsView(); return; }
  if (tab === 'leaderboard') { app.innerHTML = leaderboardView(); return; }
  if (tab === 'chest') { app.innerHTML = chestView(); return; }
  if (tab === 'miner') { app.innerHTML = minerView(); return; }
  if (tab === 'spin') { app.innerHTML = spinView(); return; }
  if (tab === 'bank') { app.innerHTML = bankView(); return; }
  if (tab === 'me') { app.innerHTML = profileView(); return; }

  let titles = { videos: '🎬 Publicar Vídeo na Rede Global', games: '🎮 Publicar Jogo Arcade HTML' };
  app.innerHTML = `
    <div class="card">
      <b style="font-size:18px;">${titles[tab] || 'Publicar'}</b>
      <p class="rules">Compartilhe conteúdos de alta qualidade para ganhar engajamento e XP.</p>
      <input id="p-title" placeholder="Título chamativo" maxlength="100">
      ${tab === 'games' ? '<textarea id="p-content" placeholder="Cole o código HTML completo do seu jogo arcade aqui..."></textarea>' : '<input id="p-content" placeholder="Link do YouTube ou URL direta (.mp4)">'}
      <button class="p" style="margin-top:14px; width:100%;" onclick="submitPost('${tab}')">🚀 Publicar e Ganhar XP</button>
    </div>
    <div id="content-list"></div>
  `;
  renderContentList(tab);
}

function leaderboardView() {
  let users = JSON.parse(localStorage.getItem('cb_all_users') || '{}');
  users[uid] = { name: myProfile.name, badge: myProfile.badge, xp: myProfile.xp, coins: myProfile.coins };
  let sorted = Object.values(users).sort((a, b) => (b.xp || 0) - (a.xp || 0));

  return `
    <div class="card">
      <b style="font-size:20px;">🏆 Placar de Líderes Global</b>
      <p class="rules">Os usuários mais ativos e poderosos da rede Complete Box.</p>
      <div style="margin-top:16px; display:flex; flex-direction:column; gap:10px;">
        ${sorted.map((u, index) => `
          <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(1,4,9,0.75); border:1px solid var(--bd); padding:14px 18px; border-radius:16px;">
            <div class="row">
              <span style="font-weight:900; font-size:16px; width:28px; color:${index===0?'var(--gold)':index===1?'var(--mu)':index===2?'#b45309':'var(--tx)'}">#${index+1}</span>
              <span class="av" style="width:40px; height:40px; font-size:16px;">${esc(u.badge || '👤')}</span>
              <div>
                <b style="font-size:15px;">${esc(u.name)}</b>
                <div class="by">Nível ${Math.floor((u.xp || 0)/500)+1}</div>
              </div>
            </div>
            <div style="text-align:right; font-weight:bold; color:var(--ultra);">
              ⭐ ${u.xp || 0} XP
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function completeShopView() {
  return `
    <div class="card row" style="gap:6px; background: rgba(13,17,23,0.95);">
      <button class="s ${completeShopSubTab==='ofertas'?'on':''}" onclick="completeShopSubTab='ofertas'; render();">🔥 Pacotes Supreme</button>
      <button class="s ${completeShopSubTab==='trocas'?'on':''}" onclick="completeShopSubTab='trocas'; render();">🔄 Câmbio Rápido</button>
      <button class="s ${completeShopSubTab==='halloween'?'on':''}" onclick="completeShopSubTab='halloween'; render();">✨ Baú Especial</button>
      <button class="s ${completeShopSubTab==='baus'?'on':''}" onclick="completeShopSubTab='baus'; render();">🎁 Cofre Lendário</button>
    </div>

    ${completeShopSubTab === 'ofertas' ? `
      <div class="card" style="border: 2px solid var(--ultra);">
        <div class="row" style="justify-content:space-between;">
          <b style="color:var(--ultra); font-size:18px;">✨ Pacote Quantum Ultra</b>
          <span style="background:rgba(35,134,54,0.25); color:#3fb950; padding:4px 10px; border-radius:10px; font-size:12px; font-weight:bold;">OFERTA IMPERDÍVEL</span>
        </div>
        <div style="font-size:42px; text-align:center; margin:18px 0;">✨ 50 Ultra Complete Coins</div>
        <p class="rules" style="text-align:center;">Adquira créditos de elite na Complete Shop para desbloquear itens exclusivos instantaneamente.</p>
        <button class="p" style="width:100%; background:linear-gradient(135deg, var(--ac), var(--ultra)); color:#010409; font-weight:900;" onclick="buyUltraPackage(50, 300000)">Comprar por 🪙 300.000 Moedas</button>
      </div>
    ` : ''}
  `;
}

function buyUltraPackage(amount, cost) {
  if (!isOwner && myProfile.coins < cost) return toast('❌ Moedas insuficientes na carteira!');
  if (!isOwner) myProfile.coins -= cost;
  myProfile.ultra += amount;
  addXp(300);
  saveProfile();
  updateHeaderStats();
  render();
  toast(`🎉 Parabéns! Você adquiriu ${amount} ✨ Ultra Complete Coins!`);
}

function exchangeCoinsToUltra() {
  const cost = 10000;
  if (!isOwner && myProfile.coins < cost) return toast('❌ Você precisa de 10.000 moedas!');
  if (!isOwner) myProfile.coins -= cost;
  myProfile.ultra += 1;
  saveProfile();
  updateHeaderStats();
  render();
  toast('🎉 Câmbio realizado: +1 ✨ Ultra Coin!');
}

function exchangeUltraToCoins() {
  if (!isOwner && myProfile.ultra < 1) return toast('❌ Você não tem Ultra Coins suficientes!');
  if (!isOwner) myProfile.ultra -= 1;
  myProfile.coins += 9500;
  saveProfile();
  updateHeaderStats();
  render();
  toast('🎉 Câmbio realizado: +9.500 Moedas!');
}

function openChestType(type) {
  if (type === 'common') {
    if (!isOwner && myProfile.coins < 500) return toast('❌ Moedas insuficientes!');
    if (!isOwner) myProfile.coins -= 500;
    let reward = Math.floor(Math.random() * 3500) + 1000;
    myProfile.coins += reward;
    addXp(100);
    toast(`🎁 Cofre Comum aberto! Você ganhou +${reward} moedas e +100 XP!`);
  } else {
    if (!isOwner && myProfile.ultra < 2) return toast('❌ Você precisa de 2 ✨ Ultra Coins!');
    if (!isOwner) myProfile.ultra -= 2;
    let rewardUltra = Math.floor(Math.random() * 8) + 4;
    myProfile.ultra += rewardUltra;
    addXp(350);
    toast(`🎁 Cofre Ultra aberto! Você ganhou +${rewardUltra} Ultra Coins e +350 XP!`);
  }
  saveProfile();
  updateHeaderStats();
  render();
}
