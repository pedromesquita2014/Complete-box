<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complete Box - Edição Ultra Complete Coins</title>
<style>
:root {
  --bg: #0b0f19;
  --card: #131b2e;
  --card-hover: #1c2642;
  --tx: #f3f6fc;
  --mu: #8a99ad;
  --ac: #3b82f6;
  --ac2: #10b981;
  --bd: #1e293b;
  --gold: #f59e0b;
  --ultra: #00f0ff;
  --green: #10b981;
  --red: #ef4444;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(1600px 800px at 50% -200px, rgba(59,130,246,0.15), transparent), var(--bg);
  color: var(--tx);
  font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(11,15,25,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--bd);
  padding: 14px 22px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo {
  font-weight: 900;
  font-size: 24px;
  background: linear-gradient(90deg, #3b82f6, #00f0ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -0.5px;
}
.online-badge {
  font-size: 11px;
  background: rgba(16,185,129,0.12);
  color: var(--green);
  border: 1px solid rgba(16,185,129,0.35);
  padding: 4px 10px;
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
}
.online-dot {
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--green);
}
.wallet-box {
  margin-left: auto;
  display: flex;
  gap: 8px;
}
.currency-pill {
  font-weight: 800;
  background: rgba(245,158,11,0.1);
  border: 1px solid rgba(245,158,11,0.3);
  color: #fbbf24;
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 13px;
}
.currency-pill.ultra {
  background: rgba(0,240,255,0.1);
  border-color: rgba(0,240,255,0.3);
  color: var(--ultra);
}
nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 22px;
  scrollbar-width: none;
  background: rgba(11,15,25,0.7);
  border-bottom: 1px solid var(--bd);
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: none;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  border-radius: 20px;
  padding: 8px 16px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
}
nav button:hover { border-color: var(--ac); background: var(--card-hover); }
nav button.on {
  background: linear-gradient(135deg, var(--ac), #2563eb);
  color: #fff;
  border-color: transparent;
  font-weight: 800;
  box-shadow: 0 6px 20px rgba(59,130,246,0.4);
}
main {
  max-width: 840px;
  margin: 0 auto;
  padding: 20px 20px 60px;
}
.hero {
  margin: 0 0 18px;
  padding: 20px 22px;
  border-radius: 20px;
  color: #fff;
  background: linear-gradient(135deg, #1e293b, #0f172a);
  border: 1px solid var(--bd);
  font-weight: 700;
}
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 22px;
  margin: 16px 0;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.rules { font-size: 13px; color: var(--mu); margin-bottom: 8px; }
input, textarea, select {
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: var(--tx);
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 12px 16px;
  margin: 8px 0;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--ac);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
}
textarea { min-height: 110px; resize: vertical; }
button.p {
  background: linear-gradient(135deg, var(--ac), #2563eb);
  color: #fff;
  border: 0;
  border-radius: 14px;
  padding: 12px 22px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(59,130,246,0.35);
}
button.s {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--bd);
  color: var(--tx);
  border-radius: 14px;
  padding: 9px 16px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
button.s.on { background: var(--ac); border-color: transparent; color: #fff; }
button.danger {
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.35);
  color: var(--red);
  border-radius: 12px;
  padding: 8px 14px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.by { font-size: 12px; color: var(--mu); }
.empty { text-align: center; color: var(--mu); padding: 45px 16px; font-weight: 500; }
iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 14px; background: #000; }
iframe.g { aspect-ratio: 4/3; background: #fff; width: 100%; border-radius: 14px; border: 1px solid var(--bd); }
.av {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--ac), var(--ultra));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  overflow: hidden;
  flex: none;
  font-size: 24px;
}
#toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  top: 90px;
  background: linear-gradient(135deg, var(--ac), var(--ultra));
  color: #fff;
  padding: 12px 26px;
  border-radius: 30px;
  font-weight: 700;
  z-index: 999;
  box-shadow: 0 12px 35px rgba(0,0,0,0.5);
}
.contact-item { background: var(--bg); border: 1px solid var(--bd); padding: 12px 16px; border-radius: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 8px; transition: border-color 0.2s; }
.contact-item:hover { border-color: var(--ac); }
pre { background: var(--bg); border: 1px solid var(--bd); border-radius: 10px; padding: 12px; overflow-x: auto; font-size: 12px; color: var(--tx); }
</style>
</head>
<body>

<header>
  <span class="logo">📦 Complete Box</span>
  <span class="online-badge"><span class="online-dot"></span> Online</span>
  <div class="wallet-box">
    <span class="currency-pill" id="coins-pill">🪙 0</span>
    <span class="currency-pill ultra" id="ultra-pill">✨ 0</span>
  </div>
</header>

<main>
  <div class="hero">
    <div>
      🌐 <b>Rede Global Ultra Ativa!</b>
      <div style="font-size: 12px; opacity: 0.9; margin-top: 3px;">Com Ultra Complete Coins, Loja de Acessórios e Áudio no PV.</div>
    </div>
  </div>

  <nav id="nav"></nav>
  <div id="app"></div>
</main>

<script>
function sanitize(input) {
  return typeof input === 'string' ? input : '';
}

let uid = localStorage.getItem('cb_uid');
if (!uid) {
  uid = 'user_' + Math.random().toString(36).substring(2, 9);
  localStorage.setItem('cb_uid', uid);
}

const OWNER_KEY = 'cb_is_pedro_owner';
if (location.hash === '#pedromesquita2026' || localStorage.getItem(OWNER_KEY) === 'true') {
  localStorage.setItem(OWNER_KEY, 'true');
}

let isOwner = localStorage.getItem(OWNER_KEY) === 'true';
let myCoins = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_coins')) || 200);
let myUltra = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_ultra')) || 5); // ✨ Ultra Complete Coins iniciais
let mySavings = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_savings')) || 0);
let myBadge = localStorage.getItem('cb_badge') || (isOwner ? '👑' : '👤');

let myProfile = {
  name: isOwner ? 'Pedro Mesquita (Dono)' : (localStorage.getItem('cb_name') || 'Visitante_' + uid.slice(-4)),
  badge: myBadge,
  coins: myCoins,
  ultra: myUltra,
  savings: mySavings
};

function saveProfile() {
  if (!isOwner) {
    localStorage.setItem('cb_name', myProfile.name);
    localStorage.setItem('cb_coins', myProfile.coins);
    localStorage.setItem('cb_ultra', myProfile.ultra);
    localStorage.setItem('cb_savings', myProfile.savings);
    localStorage.setItem('cb_badge', myProfile.badge);
  }
}

let allUsers = JSON.parse(localStorage.getItem('cb_all_users') || '{}');
allUsers[uid] = { name: myProfile.name, badge: myProfile.badge };
localStorage.setItem('cb_all_users', JSON.stringify(allUsers));

function toast(msg) {
  document.querySelectorAll('#toast').forEach(x => x.remove());
  const e = document.createElement('div');
  e.id = 'toast';
  e.textContent = msg;
  document.body.append(e);
  setTimeout(() => e.remove(), 3500);
}

let tab = 'videos';
let shopCategory = 'coroas';
let currentChatUser = null;
let mediaRecorder = null;
let audioChunks = [];

let dataList = JSON.parse(localStorage.getItem('cb_datalist') || JSON.stringify({
  videos: [
    { id: 'v1', title: 'Bem-vindo ao Complete Box', content: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ', by: 'system', authorName: 'Pedro Mesquita (Dono)', authorBadge: '👑', ts: Date.now() }
  ],
  games: [
    { id: 'g1', title: 'Jogo Exemplo HTML', content: '<body style="background:#111;color:#fff;text-align:center;padding-top:40px;font-family:sans-serif;"><h2>🎮 Jogo de Teste</h2><button onclick="alert(\'Funcionando!\')" style="padding:10px 20px;background:#3b82f6;color:#fff;border:0;border-radius:8px;cursor:pointer;">Clique em mim!</button></body>', by: 'system', authorName: 'Pedro Mesquita (Dono)', authorBadge: '👑', ts: Date.now() }
  ],
  pv: {},
  aiMsgs: [
    { role: 'ai', text: 'Olá! Sou a Complete AI com o Speaky e as novas Ultra Complete Coins ✨!' }
  ]
}));

function saveData() {
  localStorage.setItem('cb_datalist', JSON.stringify(dataList));
}

const TABS = [
  ['videos', '🎬 Vídeos'],
  ['games', '🎮 Jogos'],
  ['chat', '💬 Contatos PV'],
  ['shop', '🛍️ Loja & Ultra Coins'],
  ['ai', '🤖 IA & Speaky'],
  ['chest', '🎁 Baú 1h'],
  ['missions', '🎯 Missões'],
  ['miner', '⛏️ Mineração'],
  ['spin', '🎡 Roleta'],
  ['bank', '🏦 Poupança'],
  ['me', '👤 Perfil']
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeAgo = ts => {
  if (!ts) return 'agora';
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 60) return 'agora';
  if (sec < 3600) return Math.floor(sec/60) + 'm atrás';
  return Math.floor(sec/3600) + 'h atrás';
};

function nav() {
  const el = $('#nav');
  if (el) el.innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('');
}

function go(k) { 
  if (k === 'chat') currentChatUser = null;
  tab = k; 
  nav(); 
  render(); 
}

function renderHeader() {
  const cEl = $('#coins-pill');
  const uEl = $('#ultra-pill');
  if (cEl) cEl.textContent = isOwner ? '🪙 ∞' : `🪙 ${myProfile.coins}`;
  if (uEl) uEl.textContent = isOwner ? '✨ ∞' : `✨ ${myProfile.ultra}`;
}

function render() {
  renderHeader();
  const app = $('#app');
  if (!app) return;

  if (tab === 'chat') { 
    if (!currentChatUser) app.innerHTML = contactsListView();
    else { app.innerHTML = chatPVView(currentChatUser); drawPVMessages(currentChatUser); }
    return; 
  }
  if (tab === 'shop') { app.innerHTML = shopView(); return; }
  if (tab === 'ai') { app.innerHTML = aiView(); drawAIMessages(); return; }
  if (tab === 'chest') { app.innerHTML = chestView(); return; }
  if (tab === 'missions') { app.innerHTML = missionsView(); return; }
  if (tab === 'miner') { app.innerHTML = minerView(); return; }
  if (tab === 'spin') { app.innerHTML = spinView(); return; }
  if (tab === 'bank') { app.innerHTML = bankView(); return; }
  if (tab === 'me') { app.innerHTML = profileView(); return; }

  let titles = { videos: '🎬 Publicar Vídeo Global', games: '🎮 Publicar Jogo HTML' };
  app.innerHTML = `
    <div class="card">
      <b style="font-size:17px;">${titles[tab] || 'Publicar'}</b>
      <p class="rules">Compartilhe conteúdos instantaneamente na rede.</p>
      <input id="p-title" placeholder="Título da publicação" maxlength="100">
      ${tab === 'games' ? '<textarea id="p-content" placeholder="Cole o código HTML completo do seu jogo aqui..."></textarea>' : '<input id="p-content" placeholder="Link do YouTube ou URL direta (.mp4)">'}
      <button class="p" style="margin-top:12px; width:100%;" onclick="submitPost('${tab}')">🚀 Publicar Agora</button>
    </div>
    <div id="content-list"></div>
  `;
  renderContentList(tab);
}

// --- LOJA & ULTRA COMPLETE COINS ---
const EMOJIS = ['👑','✨','🔥','⚡','🚀','💎','🏆','🎯','🎨','🔮','🛡️','🗡️','🐉','🐯','🦅','🍀','🎩','🎸','🍕','🍔','🛸','💡','🪐','🎲','🍉','🍩'];
const ADJ = ['Lendário','Supremo','Místico','Elite','Imperial','Divino','Solar','Lunar','Cyber','Fênix','Soberano','Alpha','Quantum','Vanguard','Stellar','Neon','Prime'];
const TYPE = ['Coroa','Escudo','Espada','Orbe','Símbolo','Manto','Anel','Cristal','Aura','Emblema'];

let SHOP_ITEMS = [];
for (let i = 1; i <= 60; i++) {
  let cat = i <= 15 ? 'coroas' : i <= 30 ? 'auras' : i <= 45 ? 'espadas' : 'emblemas';
  let badge = EMOJIS[(i - 1) % EMOJIS.length];
  let name = `${badge} ${TYPE[(i - 1) % TYPE.length]} ${ADJ[(i - 1) % TYPE.length]} #${i}`;
  let price = 100 + (i * 40);
  let isUltraItem = i % 5 === 0; // Itens ultra exigem ✨ Ultra Complete Coins
  SHOP_ITEMS.push({ id: 'item_' + i, name, desc: `Personalização exclusiva nível ${i}`, price, currency: isUltraItem ? 'ultra' : 'coins', badge, category: cat });
}

function shopView() {
  const cats = [['coroas', '👑 Coroas'], ['auras', '🔥 Auras'], ['espadas', '🗡️ Espadas'], ['emblemas', '✨ Emblemas']];
  const filtered = SHOP_ITEMS.filter(i => i.category === shopCategory);

  return `
    <div class="card">
      <b style="font-size:18px;">🛍️ Loja & Câmbio de ✨ Ultra Complete Coins</b>
      <p class="rules">Adquira acessórios exclusivos ou troque suas moedas por Ultra Complete Coins valiosas.</p>
      
      <div style="background:var(--bg); border:1px solid var(--bd); padding:14px; border-radius:14px; margin:14px 0;" class="row" style="justify-content:space-between;">
        <div>
          <b style="color:var(--ultra);">🔄 Câmbio Rápido:</b>
          <div class="by">Troque 20.000 Moedas por 1 ✨ Ultra Complete Coin</div>
        </div>
        <button class="p" style="background:linear-gradient(135deg, var(--ac), var(--ultra)); color:#000;" onclick="exchangeCoinsToUltra()">Trocar Moedas 🪙</button>
      </div>

      <div class="row" style="gap:6px; margin-top:12px;">
        ${cats.map(([k, l]) => `<button class="s ${shopCategory===k?'on':''}" onclick="shopCategory='${k}'; render();">${l}</button>`).join('')}
      </div>
    </div>
    <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:14px;">
      ${filtered.map(i => `
        <div class="card" style="margin:0; display:flex; flex-direction:column; justify-content:space-between;">
          <div>
            <div style="font-size:32px; margin-bottom:10px;">${i.badge}</div>
            <b style="font-size:15px; display:block; margin-bottom:4px;">${esc(i.name)}</b>
            <div class="rules" style="font-size:12px; margin-bottom:14px;">${esc(i.desc)}</div>
          </div>
          <div>
            <div style="color:${i.currency==='ultra'?'var(--ultra)':'var(--gold)'}; font-weight:bold; margin-bottom:10px;">${i.currency==='ultra'?'✨ '+i.price+' Ultra Coins':'🪙 '+i.price}</div>
            <button class="p" style="width:100%; padding:10px;" onclick="buyCustomization('${i.id}', ${i.price}, '${i.currency}', '${i.badge}')">Comprar e Usar 🛒</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function exchangeCoinsToUltra() {
  const cost = 20000;
  if (!isOwner) {
    let tot = myProfile.coins + myProfile.savings;
    if (tot < cost) return toast('❌ Você precisa de pelo menos 20.000 Moedas para trocar por 1 ✨ Ultra Complete Coin!');
    if (myProfile.coins < cost) {
      let diff = cost - myProfile.coins;
      myProfile.coins = 0;
      myProfile.savings -= diff;
    } else {
      myProfile.coins -= cost;
    }
  }
  myProfile.ultra += 1;
  saveProfile();
  renderHeader();
  render();
  toast('🎉 Sucesso! +1 ✨ Ultra Complete Coin adicionada à sua carteira.');
}

function buyCustomization(id, price, currency, badge) {
  if (isOwner) {
    myProfile.badge = badge;
    saveProfile();
    return toast('🎉 Item equipado instantaneamente (Dono)!');
  }

  if (currency === 'ultra') {
    if (myProfile.ultra < price) return toast('❌ Você não tem ✨ Ultra Complete Coins suficientes!');
    myProfile.ultra -= price;
  } else {
    let tot = myProfile.coins + myProfile.savings;
    if (tot < price) return toast('❌ Moedas insuficientes na carteira e poupança!');
    if (myProfile.coins < price) {
      let diff = price - myProfile.coins;
      myProfile.coins = 0;
      myProfile.savings -= diff;
    } else {
      myProfile.coins -= price;
    }
  }

  myProfile.badge = badge;
  saveProfile();
  renderHeader();
  render();
  toast('🎉 Compra realizada! Sua nova personalização foi aplicada.');
}

// --- CHAT PV COM ÁUDIO ---
function contactsListView() {
  let users = JSON.parse(localStorage.getItem('cb_all_users') || '{}');
  delete users[uid];
  const keys = Object.keys(users);
  
  let contactsHTML = keys.length === 0 ? '<div class="empty">Nenhum outro usuário na rede ainda.</div>' : keys.map(id => {
    let u = users[id];
    return `
      <div class="contact-item" onclick="currentChatUser='${id}'; render();">
        <span class="av" style="width:44px; height:44px; font-size:18px;">${esc(u.badge || '👤')}</span>
        <div>
          <b style="font-size:16px;">${esc(u.name)}</b>
          <div class="by">Toque para abrir a conversa privada (PV) 💬</div>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="card">
      <b style="font-size:18px;">💬 Conversas Privadas (PV) com Áudio</b>
      <p class="rules">Selecione um contato para conversar no privado ou enviar mensagens de voz.</p>
    </div>
    <div>${contactsHTML}</div>
  `;
}

function chatPVView(targetUid) {
  let users = JSON.parse(localStorage.getItem('cb_all_users') || '{}');
  let target = users[targetUid] || { name: 'Usuário', badge: '👤' };

  return `
    <div class="card row" style="justify-content:space-between; padding:14px 20px;">
      <div class="row">
        <button class="s" onclick="currentChatUser=null; render();">← Voltar</button>
        <span class="av" style="width:40px; height:40px; font-size:16px;">${esc(target.badge)}</span>
        <div>
          <b style="font-size:16px;">${esc(target.name)}</b>
          <div class="by" style="color:var(--green)">● PV Seguro com Áudio</div>
        </div>
      </div>
    </div>
    <div id="pv-msgs" style="height:44vh; overflow-y:auto; border:1px solid var(--bd); padding:16px; border-radius:16px; background:rgba(11,15,25,0.7);"></div>
    <div class="row" style="margin-top:14px;">
      <input id="pv-input" style="flex:1;" placeholder="Digite ou grave um áudio..." onkeydown="if(event.key==='Enter')sendPVMessage('${targetUid}')">
      <button class="s" onclick="toggleAudioRecording('${targetUid}')" id="mic-btn" title="Gravar Áudio">🎤</button>
      <button class="p" onclick="sendPVMessage('${targetUid}')">Enviar 🚀</button>
    </div>
  `;
}

function drawPVMessages(targetUid) {
  const m = $('#pv-msgs');
  if (!m) return;
  if (!dataList.pv) dataList.pv = {};
  let chatKey = [uid, targetUid].sort().join('_');
  let msgs = dataList.pv[chatKey] || [];

  if (msgs.length === 0) {
    m.innerHTML = '<div class="empty">Nenhuma mensagem ainda. Envie texto ou voz!</div>';
    return;
  }

  m.innerHTML = msgs.map(x => {
    let isMe = x.sender === uid;
    let contentHtml = x.type === 'audio' ? `<audio controls src="${x.audioUrl}" style="max-width:220px; height:36px;"></audio>` : `<div style="font-size:13px; word-break:break-word;">${esc(x.text)}</div>`;
    return `
      <div style="margin:10px 0; display:flex; justify-content:${isMe ? 'flex-end' : 'flex-start'}">
        <div style="background:${isMe ? 'linear-gradient(135deg, var(--ac), #2563eb)' : 'var(--card)'}; border:1px solid var(--bd); border-radius:14px; padding:10px 14px; max-width:75%; color:#fff;">
          ${contentHtml}
          <div style="font-size:10px; opacity:0.8; text-align:right; margin-top:4px;">${timeAgo(x.ts)}</div>
        </div>
      </div>
    `;
  }).join('');
  m.scrollTop = m.scrollHeight;
}

function sendPVMessage(targetUid) {
  const input = $('#pv-input');
  if (!input || !input.value.trim()) return;
  const text = input.value.trim();
  input.value = '';

  if (!dataList.pv) dataList.pv = {};
  let chatKey = [uid, targetUid].sort().join('_');
  if (!dataList.pv[chatKey]) dataList.pv[chatKey] = [];

  dataList.pv[chatKey].push({ sender: uid, type: 'text', text, ts: Date.now() });
  saveData();
  drawPVMessages(targetUid);
}

function toggleAudioRecording(targetUid) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return toast('❌ Seu navegador não suporta gravação de áudio.');
  }

  if (!mediaRecorder || mediaRecorder.state === 'inactive') {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
        const audioUrl = URL.createObjectURL(audioBlob);

        if (!dataList.pv) dataList.pv = {};
        let chatKey = [uid, targetUid].sort().join('_');
        if (!dataList.pv[chatKey]) dataList.pv[chatKey] = [];

        dataList.pv[chatKey].push({ sender: uid, type: 'audio', audioUrl, ts: Date.now() });
        saveData();
        drawPVMessages(targetUid);
        toast('🎤 Áudio enviado com sucesso!');
      };

      mediaRecorder.start();
      $('#mic-btn').style.background = 'var(--red)';
      toast('🔴 Gravando áudio... Clique novamente para parar.');
    }).catch(() => toast('❌ Permissão de microfone negada.'));
  } else {
    mediaRecorder.stop();
    $('#mic-btn').style.background = '';
  }
}

// --- AI & SPEAKY ---
function aiView() {
  return `
    <div class="card">
      <b style="font-size:18px;">🤖 Complete AI & 🗣️ Complete Speaky</b>
      <p class="rules">Converse com a IA e use o recurso <b>Speaky</b> para ouvir as respostas faladas em voz alta!</p>
      <input id="ai-game-prompt" placeholder="Ex: Criar jogo estilo flappy ou pong">
      <button class="p" style="margin-top:8px; width:100%;" onclick="generateAIGame()">⚡ Gerar Jogo com IA</button>
    </div>
    <div id="ai-chat-box" style="height: 42vh; overflow-y: auto; border-radius: 16px; padding: 14px; border: 1px solid var(--bd); background: rgba(11,15,25,0.7); margin-bottom: 14px;"></div>
    <div class="row">
      <input id="ai-input" placeholder="Pergunte algo para a IA..." onkeydown="if(event.key==='Enter')sendAIMessage()" style="flex:1;">
      <button class="p" onclick="sendAIMessage()">Conversar 🤖</button>
    </div>
  `;
}

function speakText(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'pt-BR';
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
    toast('🗣️ Complete Speaky falando...');
  }
}

function drawAIMessages() {
  const box = $('#ai-chat-box');
  if (!box) return;
  box.innerHTML = dataList.aiMsgs.map(m => `
    <div style="margin:12px 0; display:flex; flex-direction:${m.role === 'user' ? 'row-reverse' : 'row'}; gap:10px; align-items:flex-start;">
      <span class="av" style="width:36px; height:36px; font-size:14px; background:${m.role === 'user' ? 'var(--ac)' : 'var(--ultra)'};">${m.role === 'user' ? '👤' : '🤖'}</span>
      <div style="background:${m.role === 'user' ? 'var(--card)' : 'rgba(28,37,65,0.8)'}; border:1px solid var(--bd); border-radius:14px; padding:10px 14px; max-width:80%;">
        <div class="row" style="justify-content:space-between;">
          <b>${m.role === 'user' ? 'Você' : '🤖 Complete AI'}</b>
          ${m.role === 'ai' ? `<button class="s" style="padding:2px 8px; font-size:11px;" onclick="speakText('${m.text.replace(/'/g, "\\'")}')">🗣️ Speaky</button>` : ''}
        </div>
        <div style="margin-top:4px; font-size:14px; word-break:break-word;">${esc(m.text)}</div>
        ${m.code ? `<pre style="margin-top:8px;">${esc(m.code)}</pre><button class="p" style="margin-top:8px;" onclick="publishAIGame('${esc(m.gameTitle)}')">🚀 Publicar este Jogo</button>` : ''}
      </div>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

function sendAIMessage() {
  const input = $('#ai-input');
  if (!input) return;
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  dataList.aiMsgs.push({ role: 'user', text: q });
  saveData();
  drawAIMessages();

  setTimeout(() => {
    let reply = "Entendi! As Ultra Complete Coins estão funcionando a todo vapor.";
    const lower = q.toLowerCase();
    if (lower.includes('olá') || lower.includes('oi')) reply = "Olá! O Speaky e as Ultra Coins estão ativos!";
    else if (lower.includes('loja')) reply = "Você pode comprar acessórios na loja ou trocar moedas por Ultra Complete Coins!";
    else if (lower.includes('dono')) reply = "O Dono supremo é o Pedro Mesquita!";
    
    dataList.aiMsgs.push({ role: 'ai', text: reply });
    saveData();
    drawAIMessages();
    speakText(reply);
  }, 600);
}

function generateAIGame() {
  const input = $('#ai-game-prompt');
  if (!input) return;
  const prompt = input.value.trim();
  if (!prompt) return toast('Digite uma ideia para o jogo!');
  toast('⏳ IA gerando código do jogo...');
  
  setTimeout(() => {
    const code = `<!DOCTYPE html><html><head><style>body{margin:0;background:#111;color:#fff;text-align:center;font-family:sans-serif;}canvas{background:#222;border:2px solid #3b82f6;margin-top:10px;border-radius:8px;}</style></head><body><h3>🎮 ${prompt}</h3><canvas id="c" width="340" height="200"></canvas><p>Pontos: <b id="s">0</b></p><script>const c=document.getElementById('c'),x=c.getContext('2d');let score=0,py=140,vy=0,ox=340;window.onclick=()=>{if(py>=140)vy=-8;};function loop(){vy+=0.4;py+=vy;if(py>140){py=140;vy=0;}ox-=4;if(ox<-20){ox=340;score+=10;document.getElementById('s').textContent=score;}x.clearRect(0,0,340,200);x.fillStyle='#3b82f6';x.fillRect(40,py,20,20);x.fillStyle='#00f0ff';x.fillRect(ox,140,20,20);requestAnimationFrame(loop);}loop();<\/script></body></html>`;
    dataList.aiMsgs.push({ role: 'ai', text: `Jogo "${prompt}" gerado com sucesso!`, code, gameTitle: prompt });
    saveData();
    drawAIMessages();
    speakText(`Jogo ${prompt} gerado!`);
    toast('✨ Jogo gerado!');
  }, 1000);
}

function publishAIGame(title) {
  const lastMsg = [...dataList.aiMsgs].reverse().find(m => m.code);
  if (!lastMsg) return;
  const postObj = { id: 'g_' + Math.random().toString(36).substring(2, 9), title: 'Jogo IA: ' + title, content: lastMsg.code, by: uid, authorName: myProfile.name, authorBadge: myProfile.badge, ts: Date.now() };
  dataList.games.unshift(postObj);
  saveData();
  toast('🎮 Jogo publicado!');
  go('games');
}

// --- BAÚ 1H ---
function chestView() {
  const lastChest = parseInt(localStorage.getItem('cb_last_chest') || '0');
  const now = Date.now();
  const diff = now - lastChest;
  const oneHour = 3600000;
  const canClaim = diff >= oneHour;
  const timeLeft = canClaim ? 0 : Math.ceil((oneHour - diff) / 60000);

  return `
    <div class="card" style="text-align:center; padding:35px 20px;">
      <b style="font-size:22px;">🎁 Baú Misterioso (A cada 1h)</b>
      <p class="rules" style="margin-top:8px;">Volte a cada 1 hora para abrir seu baú!</p>
      <div style="font-size:70px; margin:24px 0;">📦</div>
      <div style="margin-bottom:20px; font-weight:bold; font-size:16px; color:var(--gold);">
        ${canClaim ? '✨ Baú Disponível!' : `⏳ Próximo em ${timeLeft} minutos.`}
      </div>
      <button class="p" style="padding:14px 30px; font-size:16px;" ${canClaim ? '' : 'disabled style="opacity:0.5; cursor:not-allowed;"'} onclick="claimChest()">Abrir Baú 🔓</button>
    </div>
  `;
}

function claimChest() {
  const lastChest = parseInt(localStorage.getItem('cb_last_chest') || '0');
  const now = Date.now();
  if (now - lastChest < 3600000) return toast('Recarga de 1h em andamento!');
  localStorage.setItem('cb_last_chest', now);
  const reward = Math.floor(Math.random() * 80) + 40;
  if (!isOwner) { myProfile.coins += reward; saveProfile(); }
  renderHeader(); render();
  toast(`🎉 +${reward} moedas no baú!`);
}

function claimMission(key, reward) {
  if (localStorage.getItem('cb_m_' + key) === 'done') return toast('Missão já concluída!');
  localStorage.setItem('cb_m_' + key, 'done');
  if (!isOwner) { myProfile.coins += reward; saveProfile(); }
  renderHeader(); render(); toast(`🎉 +${reward} moedas!`);
}

function missionsView() {
  return `
    <div class="card">
      <b style="font-size:18px;">🎯 Missões Diárias</b>
      <p class="rules">Complete as tarefas para acumular moedas.</p>
    </div>
    <div class="card row" style="justify-content:space-between;">
      <div>
        <b style="font-size:15px;">Girar a Roleta da Sorte</b>
        <div class="rules" style="margin:2px 0 0;">Ganhe 20 moedas.</div>
      </div>
      <button class="p" onclick="claimMission('spin', 20)">Resgatar 🎁</button>
    </div>
  `;
}

let minerClicks = 0;
function minerView() {
  return `
    <div class="card" style="text-align:center; padding:35px 20px;">
      <b style="font-size:22px;">⛏️ Mineração</b>
      <p class="rules">Clique rapidamente no bloco abaixo para farmar moedas!</p>
      <div style="margin:30px auto; width:140px; height:140px; background:linear-gradient(135deg, var(--ac), var(--ultra)); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:50px; cursor:pointer;" onclick="clickMiner()">✨</div>
      <div style="font-size:16px; color:var(--gold);">Moedas mineradas: <b id="mc">${minerClicks}</b></div>
    </div>
  `;
}
function clickMiner() {
  minerClicks++;
  const el = $('#mc'); if(el) el.textContent = minerClicks;
  if(!isOwner && minerClicks % 10 === 0) { myProfile.coins += 5; saveProfile(); renderHeader(); toast('⚡ +5 moedas!'); }
}

function spinView() {
  return `
    <div class="card" style="text-align:center; padding:35px 20px;">
      <b style="font-size:22px;">🎡 Roleta Diária</b>
      <div id="sp-txt" style="color:var(--gold); font-size:22px; font-weight:800; margin:24px 0; padding:16px; background:var(--bg); border:2px dashed var(--ac); border-radius:14px;">GIRO PRONTO</div>
      <button class="p" onclick="doSpin()">Girar Roleta 🎰</button>
    </div>
  `;
}
function doSpin() {
  const d = new Date().toDateString();
  if(localStorage.getItem('cb_spin') === d) return toast('Já girou hoje!');
  localStorage.setItem('cb_spin', d);
  const w = [20, 50, 100, 200][Math.floor(Math.random()*4)];
  $('#sp-txt').textContent = `🎉 +${w} Moedas!`;
  if(!isOwner) { myProfile.coins += w; saveProfile(); }
  renderHeader(); toast(`🎉 Ganhou ${w} moedas!`);
}

function bankView() {
  return `
    <div class="card">
      <b style="font-size:18px;">🏦 Poupança</b>
      <div style="background:var(--bg); border:1px solid var(--bd); border-radius:14px; padding:16px; margin: 16px 0;">
        <div style="font-size:14px; color:var(--mu);">Carteira: <b>🪙 ${isOwner ? '∞' : myProfile.coins}</b></div>
        <div style="font-size:16px; margin-top:4px; color:var(--gold);">Poupança: <b>🪙 ${isOwner ? '∞' : myProfile.savings}</b></div>
      </div>
      <input id="bk-amt" type="number" placeholder="Quantidade" min="1">
      <div class="row" style="margin-top:10px;">
        <button class="p" style="flex:1;" onclick="dep()">Depositar 📥</button>
        <button class="s" style="flex:1;" onclick="wit()">Sacar 📤</button>
      </div>
    </div>
  `;
}
function dep() {
  const v = parseInt($('#bk-amt').value);
  if(!v || v <= 0 || myProfile.coins < v) return toast('Erro no saldo!');
  myProfile.coins -= v; myProfile.savings += v; saveProfile(); render(); toast('Depositado!');
}
function wit() {
  const v = parseInt($('#bk-amt').value);
  if(!v || v <= 0 || myProfile.savings < v) return toast('Erro no saldo!');
  myProfile.savings -= v; myProfile.coins += v; saveProfile(); render(); toast('Sacado!');
}

// --- PERFIL ---
function profileView() {
  const myVideos = (dataList.videos || []).filter(x => x.by === uid);
  const myGames = (dataList.games || []).filter(x => x.by === uid);

  return `
    <div class="card" style="text-align:center; padding:35px 20px;">
      <span class="av" style="width:80px; height:80px; font-size:34px; margin-bottom:10px;">${myProfile.badge}</span>
      <h2 style="margin:4px 0 2px; font-size:24px;">${esc(myProfile.name)}</h2>
      <div class="by">${isOwner ? '👑 Administrador / Dono' : '👤 Usuário Ativo'}</div>
      <div class="row" style="justify-content:center; gap:20px; margin-top:20px; border-top:1px solid var(--bd); border-bottom:1px solid var(--bd); padding:14px 0;">
        <div><b style="font-size:15px;">${myVideos.length + myGames.length}</b><div class="by">Posts</div></div>
        <div><b style="font-size:15px;">🪙 ${isOwner ? '∞' : myProfile.coins}</b><div class="by">Moedas</div></div>
        <div><b style="font-size:15px;">✨ ${isOwner ? '∞' : myProfile.ultra}</b><div class="by">Ultra Coins</div></div>
      </div>
    </div>
    <div class="card">
      <b style="font-size:17px;">⚙️ Configurações</b>
      ${isOwner ? '<p class="rules" style="margin-top:6px;">Modo Dono Ativo.</p>' : `
        <input id="new-name" value="${esc(myProfile.name)}" placeholder="Seu nome">
        <button class="p" style="margin-top:10px;" onclick="myProfile.name=sanitize($('#new-name').value); saveProfile(); toast('Nome alterado!'); render();">Salvar Nome</button>
        <hr style="border:0; border-top:1px solid var(--bd); margin:18px 0;">
        <input id="op-pass" type="password" placeholder="Senha do Dono">
        <button class="s" style="margin-top:6px; width:100%;" onclick="if($('#op-pass').value==='dono-pedro-2026'){localStorage.setItem('${OWNER_KEY}','true');location.reload();}else{toast('Senha incorreta!');}">Ativar Modo Dono 👑</button>
      `}
    </div>
    <div class="card">
      <b style="font-size:17px;">📸 Suas Publicações</b>
      <div style="margin-top:16px;">
        ${!myVideos.length && !myGames.length ? '<div class="empty">Nenhum post publicado.</div>' : ''}
        ${myVideos.map(x => `
          <div style="background:var(--bg); border:1px solid var(--bd); border-radius:16px; padding:16px; margin-bottom:16px;">
            <div class="row" style="justify-content:space-between; margin-bottom:10px;">
              <b>🎬 Vídeo: ${esc(x.title)}</b>
              <button class="danger" onclick="deletePost('videos', '${x.id}')">Apagar</button>
            </div>
            <div><iframe src="https://www.youtube.com/embed/${(x.content.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||[])[1]||''}" allowfullscreen></iframe></div>
          </div>
        `).join('')}
        ${myGames.map(x => `
          <div style="background:var(--bg); border:1px solid var(--bd); border-radius:16px; padding:16px; margin-bottom:16px;">
            <div class="row" style="justify-content:space-between; margin-bottom:10px;">
              <b>🎮 Jogo: ${esc(x.title)}</b>
              <button class="danger" onclick="deletePost('games', '${x.id}')">Apagar</button>
            </div>
            <div style="margin-top:6px;"><iframe class="g" srcdoc="${x.content}"></iframe></div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function submitPost(kind) {
  const t = sanitize($('#p-title').value);
  const c = $('#p-content').value;
  if(!t || !c) return toast('Preencha tudo!');
  const postObj = { id: 'p_' + Math.random().toString(36).substring(2, 9), title: t, content: c, by: uid, authorName: myProfile.name, authorBadge: myProfile.badge, ts: Date.now() };
  dataList[kind].unshift(postObj);
  saveData();
  toast('Publicado!');
  go(kind);
}

function deletePost(kind, id) {
  if (confirm('Apagar esta publicação?')) {
    dataList[kind] = dataList[kind].filter(x => x.id !== id);
    saveData();
    toast('Apagado!');
    render();
  }
}

function renderContentList(k) {
  const box = $('#content-list'); if(!box) return;
  const items = dataList[k] || [];
  if (!items.length) { box.innerHTML = '<div class="empty">Nenhum conteúdo publicado.</div>'; return; }

  box.innerHTML = items.map(x => {
    let body = '';
    if (k === 'videos') {
      const ytMatch = x.content.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
      body = ytMatch ? `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen></iframe>` : `<a href="${esc(x.content)}" target="_blank" style="color:var(--ac)">🔗 ${esc(x.content)}</a>`;
    } else if (k === 'games') {
      body = `<div style="background:#000; border-radius:14px; padding:6px;"><iframe class="g" srcdoc="${x.content}"></iframe></div>`;
    }
    const canDelete = isOwner || x.by === uid;
    return `
      <div class="card">
        <div class="row" style="margin-bottom:12px; justify-content:space-between;">
          <div class="row">
            <span class="av" style="width:42px; height:42px; font-size:17px;">${esc(x.authorBadge || '👤')}</span>
            <div><b>${esc(x.authorName)}</b><div class="by">${timeAgo(x.ts)}</div></div>
          </div>
          ${canDelete ? `<button class="danger" onclick="deletePost('${k}', '${x.id}')">Apagar</button>` : ''}
        </div>
        <h3 style="margin:8px 0 12px; font-size:18px;">${esc(x.title)}</h3>
        ${body}
      </div>
    `;
  }).join('');
}

window.addEventListener('DOMContentLoaded', () => {
  nav();
  render();
});
</script>
