<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complete Box - Edição Suprema com Missões & Chat Offline</title>
<style>
:root {
  --bg: #120e24;
  --card: #1c1738;
  --tx: #f3f0ff;
  --mu: #9b93c4;
  --ac: #7c53ff;
  --ac2: #ff6b35;
  --bd: #2d2654;
  --gold: #ffd700;
  --green: #22c55e;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(1200px 600px at 50% -100px, rgba(124,83,255,0.28), transparent), var(--bg);
  color: var(--tx);
  font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(28,23,56,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bd);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  font-weight: 900;
  font-size: 22px;
  background: linear-gradient(90deg, var(--ac), var(--ac2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -0.5px;
}
.online-badge {
  font-size: 11px;
  background: rgba(34,197,94,0.15);
  color: var(--green);
  border: 1px solid rgba(34,197,94,0.4);
  padding: 3px 8px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
}
.online-dot {
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--green);
}
.coins {
  margin-left: auto;
  font-weight: 800;
  background: rgba(255,215,0,0.1);
  border: 1px solid rgba(255,215,0,0.3);
  color: #ffe66d;
  border-radius: 20px;
  padding: 5px 12px;
  white-space: nowrap;
  font-size: 14px;
}
nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 16px;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: none;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  border-radius: 20px;
  padding: 8px 16px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
nav button:hover { border-color: var(--ac); }
nav button.on {
  background: linear-gradient(120deg, var(--ac), var(--ac2));
  color: #fff;
  border-color: transparent;
  font-weight: 800;
  box-shadow: 0 4px 14px rgba(124,83,255,0.4);
}
main {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 16px 40px;
}
.hero {
  margin: 0 16px 12px;
  padding: 16px;
  border-radius: 16px;
  color: #fff;
  background: linear-gradient(120deg, #7c53ff, #ff6b35);
  font-weight: 700;
  box-shadow: 0 6px 20px rgba(124,83,255,0.3);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 16px;
  margin: 14px 0;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  animation: fadeIn 0.3s ease-out;
}
.rules { font-size: 13px; color: var(--mu); margin-bottom: 8px; }
input, textarea, select {
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: var(--tx);
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 10px 12px;
  margin: 6px 0;
}
input:focus, textarea:focus, select:focus {
  outline: 2px solid var(--ac);
  border-color: transparent;
}
textarea { min-height: 90px; resize: vertical; }
button.p {
  background: linear-gradient(120deg, var(--ac), #a24bff);
  color: #fff;
  border: 0;
  border-radius: 12px;
  padding: 10px 18px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(124,83,255,0.35);
  transition: transform 0.1s, opacity 0.2s;
}
button.p:active { transform: scale(0.96); }
button.s {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--bd);
  color: var(--tx);
  border-radius: 10px;
  padding: 6px 12px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}
button.s:hover { background: rgba(255,255,255,0.1); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.by { font-size: 12px; color: var(--mu); }
.empty { text-align: center; color: var(--mu); padding: 32px 12px; }
iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 12px; background: #000; }
iframe.g { aspect-ratio: 4/3; background: #fff; }
pre { background: var(--bg); border: 1px solid var(--bd); border-radius: 10px; padding: 12px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; color: var(--tx); }
.av {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--ac);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  overflow: hidden;
  flex: none;
  font-size: 16px;
}
#msgs { height: 45vh; overflow-y: auto; border-radius: 14px; padding: 12px; border: 1px solid var(--bd); background: rgba(18,14,36,0.7); }
.m { display: flex; gap: 10px; margin: 10px 0; align-items: flex-start; }
.bub {
  background: var(--card);
  color: var(--tx);
  border-radius: 14px;
  padding: 8px 14px;
  max-width: 82%;
  border: 1px solid var(--bd);
  word-break: break-word;
}
.bub b { font-size: 12px; display: block; margin-bottom: 2px; }
.bub i { font-size: 11px; color: var(--mu); font-style: normal; }
#toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  top: 75px;
  background: linear-gradient(120deg, var(--ac), var(--ac2));
  color: #fff;
  padding: 10px 20px;
  border-radius: 30px;
  font-weight: 700;
  z-index: 99;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { from { transform: translate(-50%, -20px) scale(0.7); opacity: 0; } }
.online-users-list { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0; }
.online-user-tag { background: var(--bg); border: 1px solid var(--bd); border-radius: 16px; padding: 4px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>

<header>
  <
    <div style="font-size: 12px; opacity: 0.9; font-weight: normal;">Cumpra missões diárias, envie mensagens offline e divirta-se.</div>
  </div>
</div>

<nav id="nav"></nav>

<main id="app"></main>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
function sanitize(input) {
  if (typeof input !== 'string') return input;
  return input.replace(/[<>]/g, '').slice(0, 1000);
}

const firebaseConfig = {
  apiKey: "AIzaSyAgRafNnzncOP631NU9oJTfyBNf6bIy1pQ",
  authDomain: "complete-box-2.firebaseapp.com",
  projectId: "complete-box-2",
  storageBucket: "complete-box-2.firebasestorage.app",
  messagingSenderId: "1010030427570",
  appId: "1:1010030427570:web:dc9c10130a8b98b0fbf8ab"
};

let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.settings({ experimentalAutoDetectLongPolling: true, merge: true });
} catch(e) { console.warn("Offline", e); }

let uid = localStorage.getItem('cb_uid');
if (!uid) {
  uid = 'u_' + Math.random().toString(36).substring(2, 9);
  localStorage.setItem('cb_uid', uid);
}

const OWNER_KEY = 'cb_is_pedro_owner';
if (location.hash === '#pedromesquita2026' || localStorage.getItem(OWNER_KEY) === 'true') {
  localStorage.setItem(OWNER_KEY, 'true');
}

let isOwner = localStorage.getItem(OWNER_KEY) === 'true';

let myCoins = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_coins')) || 50);
let mySavings = isOwner ? Infinity : (parseInt(localStorage.getItem('cb_savings')) || 0);

let myProfile = {
  name: isOwner ? 'Pedro Mesquita (Dono)' : (localStorage.getItem('cb_name') || 'Visitante_' + uid.slice(-4)),
  badge: isOwner ? '👑' : '👤',
  coins: myCoins,
  savings: mySavings
};

function saveProfileToGlobal() {
  if (!isOwner) {
    localStorage.setItem('cb_name', sanitize(myProfile.name));
    localStorage.setItem('cb_coins', myProfile.coins);
    localStorage.setItem('cb_savings', myProfile.savings);
  }
  if (db) {
    db.collection('profiles').doc(uid).set({
      name: sanitize(myProfile.name),
      badge: myProfile.badge,
      isOwner: isOwner,
      coins: isOwner ? 999999999 : myProfile.coins,
      ts: Date.now()
    }, { merge: true }).catch(() => {});
  }
}
saveProfileToGlobal();

function toast(msg) {
  document.querySelectorAll('#toast').forEach(x => x.remove());
  const e = document.createElement('div');
  e.id = 'toast';
  e.textContent = sanitize(msg);
  document.body.append(e);
  setTimeout(() => e.remove(), 3500);
}

let tab = 'videos';
let profiles = {};
let dataList = { videos: [], games: [], news: [], polls: [], chat: [], aiMsgs: [] };
let onlineUsers = [];
let searchQuery = '';

const TABS = [
  ['videos', '🎬 Vídeos'],
  ['games', '🎮 Jogos'],
  ['chat', '💬 Chat Global & Offline'],
  ['missions', '🎯 Missões'],
  ['miner', '⛏️ Mineração'],
  ['speak', '🗣️ Speak'],
  ['spin', '🎡 Roleta'],
  ['ai', '🤖 IA'],
  ['polls', '📊 Enquetes'],
  ['news', '📰 Notícias'],
  ['bank', '🏦 Poupança'],
  ['shop', '🛍️ Loja'],
  ['me', '👤 Perfil']
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeAgo = ts => {
  if (!ts) return 'agora';
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 60) return 'agora';
  if (sec < 3600) return Math.floor(sec/60) + 'm atrás';
  return Math.floor(sec/3600) + 'h atrás';
};

function nav() {
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('');
}

function go(k) { tab = k; searchQuery = ''; nav(); render(); }

function renderHeader() {
  const displayCoins = isOwner ? '🪙 ∞ (Dono)' : `🪙 ${myProfile.coins}`;
  $('#coins').textContent = displayCoins;
}

function setupGlobalSync() {
  if (!db) return;

  db.collection('profiles').onSnapshot(snap => {
    profiles = {}; onlineUsers = [];
    snap.docs.forEach(doc => {
      const d = doc.data(); profiles[doc.id] = d;
      if (d.ts && (Date.now() - d.ts < 300000)) onlineUsers.push({ id: doc.id, name: d.name || 'Usuário', badge: d.badge || '👤', coins: d.coins || 0 });
    });
    if (tab === 'chat' || tab === 'bank') renderChatUsers();
  });

  ['videos', 'games', 'polls'].forEach(kind => {
    db.collection(kind).orderBy('ts', 'desc').limit(50).onSnapshot(snap => {
      dataList[kind] = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      if (tab === kind) renderContentList(kind);
    });
  });

  loadAutomatedNews();

  db.collection('global_chat').orderBy('ts', 'asc').limit(100).onSnapshot(snap => {
    dataList.chat = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    if (tab === 'chat') drawMessages();
  });
}

async function loadAutomatedNews() {
  try {
    const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://g1.globo.com/rss/g1/tecnologia/');
    const data = await res.json();
    if (data && data.items) {
      dataList.news = data.items.slice(0, 10).map((item, idx) => ({
        id: 'news_' + idx,
        title: item.title,
        content: item.description.replace(/<[^>]*>?/gm, ''),
        authorName: 'G1 Tecnologia (Automático)',
        authorBadge: '📰',
        ts: new Date(item.pubDate).getTime(),
        likes: []
      }));
    } else {
      fallbackNews();
    }
  } catch(e) {
    fallbackNews();
  }
  if (tab === 'news') renderContentList('news');
}

function fallbackNews() {
  dataList.news = [
    { id: 'n1', title: 'Inteligência Artificial avança em novas ferramentas web', content: 'Desenvolvedores do mundo todo adotam arquiteturas integradas em nuvem em 2026.', authorName: 'Tech Global News', authorBadge: '📰', ts: Date.now(), likes: [] },
    { id: 'n2', title: 'Segurança digital e protocolos criptografados em alta', content: 'Novas diretrizes protegem dados de usuários contra ataques cibernéticos em redes globais.', authorName: 'Cyber Watch', authorBadge: '📰', ts: Date.now() - 3600000, likes: [] }
  ];
}

setInterval(() => {
  if (db) db.collection('profiles').doc(uid).set({ ts: Date.now() }, { merge: true }).catch(()=>{});
}, 30000);

function render() {
  renderHeader();
  const app = $('#app');

  if (tab === 'chat') { app.innerHTML = chatView(); drawMessages(); renderChatUsers(); return; }
  if (tab === 'missions') { app.innerHTML = missionsView(); return; }
  if (tab === 'miner') { app.innerHTML = minerView(); return; }
  if (tab === 'speak') { app.innerHTML = speakView(); return; }
  if (tab === 'spin') { app.innerHTML = spinView(); return; }
  if (tab === 'ai') { app.innerHTML = aiView(); drawAIMessages(); return; }
  if (tab === 'bank') { app.innerHTML = bankView(); renderChatUsers(); return; }
  if (tab === 'shop') { app.innerHTML = shopView(); return; }
  if (tab === 'me') { app.innerHTML = profileView(); return; }

  app.innerHTML = `
    ${postBoxView(tab)}
    <div class="row" style="margin: 12px 0;">
      <input id="sq" placeholder="🔍 Buscar publicações..." value="${esc(searchQuery)}" oninput="searchQuery=sanitize(this.value); renderContentList('${tab}')">
    </div>
    <div id="content-list"></div>
  `;
  renderContentList(tab);
}

// --- SISTEMA DE MISSÕES DIÁRIAS ---
function getMissionStatus(key) {
  return localStorage.getItem('cb_mission_' + key) === 'done';
}

function claimMission(key, reward) {
  if (getMissionStatus(key)) return toast('Você já concluiu esta missão!');
  localStorage.setItem('cb_mission_' + key, 'done');
  if (!isOwner) {
    myProfile.coins += reward;
    saveProfileToGlobal();
  }
  renderHeader();
  render();
  toast(`🎉 Missão concluída! +${reward} Complete Coins.`);
}

function missionsView() {
  const missions = [
    { key: 'post', title: 'Publicar um Conteúdo', desc: 'Publique um vídeo ou jogo na rede global.', reward: 30, action: () => go('videos') },
    { key: 'spin', title: 'Girar a Roleta da Sorte', desc: 'Teste sua sorte na aba Roleta.', reward: 20, action: () => go('spin') },
    { key: 'chat', title: 'Conversar no Chat Global', desc: 'Envie pelo menos uma mensagem no chat.', reward: 15, action: () => go('chat') },
    { key: 'speak', title: 'Praticar no Complete Speak', desc: 'Responda a um quiz de tradução.', reward: 25, action: () => go('speak') }
  ];

  return `
    <div class="card">
      <b style="font-size: 18px;">🎯 Missões Diárias & Recompensas</b>
      <p class="rules">Cumpra as tarefas abaixo para ganhar Complete Coins extras todos os dias!</p>
    </div>

    ${missions.map(m => {
      const done = getMissionStatus(m.key);
      return `
        <div class="card row" style="justify-content:space-between;">
          <div>
            <b>${esc(m.title)}${done ? '✅' : ''}</b>
            <div class="rules" style="margin:4px 0 0;">${esc(m.desc)}</div>
            <div style="color:var(--gold); font-weight:bold; margin-top:4px;">🪙 +${m.reward} Moedas</div>
          </div>
          <div>
            ${done ? '<button class="s" disabled>Concluído</button>' : `<button class="p" onclick="claimMission('${m.key}', ${m.reward})">Resgatar 🎁</button>`}
          </div>
        </div>
      `;
    }).join('')}
  `;
}

// --- MINI-GAME: MINERAÇÃO DE MOEDAS (CLICKER) ---
let minerClicks = 0;
function minerView() {
  return `
    <div class="card" style="text-align:center;">
      <b style="font-size: 20px;">⛏️ Mineração de Complete Coins</b>
      <p class="rules">Clique freneticamente no bloco para minerar moedas extras para sua carteira!</p>
      
      <div style="margin: 30px auto; width: 120px; height: 120px; background: linear-gradient(135deg, var(--ac), var(--ac2)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; box-shadow: 0 0 25px rgba(124,83,255,0.6);" onclick="clickMiner()">
        💎
      </div>
      <div style="font-size: 16px; color: var(--gold);">Moedas Mineradas nesta sessão: <b id="miner-count">0</b></div>
    </div>
  `;
}

function clickMiner() {
  minerClicks++;
  const el = $('#miner-count');
  if (el) el.textContent = minerClicks;
  if (!isOwner && minerClicks % 10 === 0) {
    myProfile.coins += 5;
    saveProfileToGlobal();
    renderHeader();
    toast('⚡ +5 Moedas mineradas!');
  }
}

// --- COMPLETE LUCKY SPIN ---
function spinView() {
  return `
    <div class="card" style="text-align:center;">
      <b style="font-size: 20px;">🎡 Complete Lucky Spin</b>
      <p class="rules">Gire a roleta uma vez por dia e teste sua sorte para ganhar moedas grátis!</p>
      
      <div id="spin-wheel-box" style="margin: 20px auto; padding: 30px; background: var(--bg); border: 2px dashed var(--ac); border-radius: 50% / 20%; max-width: 320px;">
        <span id="spin-result-text" style="font-size: 24px; font-weight: 900; color: var(--gold);">🎁 PRÓXIMO GIRO PRONTO</span>
      </div>

      <button class="p" style="padding: 12px 24px; font-size: 16px;" onclick="doSpinWheel()">Girar Roleta Agora! 🎰</button>
    </div>
  `;
}

function doSpinWheel() {
  const lastSpin = localStorage.getItem('cb_last_spin');
  const today = new Date().toDateString();
  if (lastSpin === today) {
    return toast('⏰ Você já girou a roleta hoje! Volte amanhã.');
  }
  localStorage.setItem('cb_last_spin', today);

  const prizes = [20, 50, 100, 200, 500];
  const won = prizes[Math.floor(Math.random() * prizes.length)];

  $('#spin-result-text').textContent = `🎉 +${won} Moedas!`;
  if (!isOwner) {
    myProfile.coins += won;
    saveProfileToGlobal();
  }
  renderHeader();
  toast(`🎉 Parabéns! Você ganhou ${won} Complete Coins na Roleta!`);
}

function claimDailyReward() {
  const lastClaim = localStorage.getItem('cb_last_claim');
  const today = new Date().toDateString();
  if (lastClaim === today) {
    return toast('⏰ Você já resgatou sua recompensa hoje! Volte amanhã.');
  }
  localStorage.setItem('cb_last_claim', today);
  const reward = 50;
  if (!isOwner) {
    myProfile.coins += reward;
    saveProfileToGlobal();
  }
  renderHeader();
  render();
  toast(`🎉 Resgatado com sucesso! +${reward} Complete Coins.`);
}

function bankView() {
  return `
    <div class="card">
      <b style="font-size: 18px;">🏦 Poupança Complete</b>
      <p class="rules">Guarde suas moedas com segurança. Ao comprar itens na Loja, o saldo da poupança é transferido automaticamente se faltar na carteira!</p>
      
      <div style="background:var(--bg); border:1px solid var(--bd); border-radius:12px; padding:14px; margin: 12px 0;">
        <div style="font-size:14px; color:var(--mu);">Saldo na Carteira: <b>🪙 ${isOwner ? '∞' : myProfile.coins}</b></div>
        <div style="font-size:16px; margin-top:4px; color:var(--gold);">Saldo na Poupança: <b>🪙 ${isOwner ? '∞' : myProfile.savings}</b></div>
      </div>

      <div class="row" style="margin-top:10px;">
        <input id="bank-amount" type="number" placeholder="Quantidade" min="1" style="flex:1;">
        <button class="p" onclick="depositSavings()">Depositar 📥</button>
        <button class="s" onclick="withdrawSavings()">Sacar 📤</button>
      </div>
    </div>

    <div class="card">
      <b>🎁 Enviar Presente para Amigos na Rede</b>
      <p class="rules">Envie moedas diretamente para outros usuários online!</p>
      <select id="gift-target" style="margin:6px 0;">
        <option value="">Selecione um amigo online...</option>
        ${onlineUsers.filter(u => u.id !== uid).map(u => `<option value="${u.id}">${esc(u.badge)}${esc(u.name)}</option>`).join('')}
      </select>
      <input id="gift-amount" type="number" placeholder="Quantidade de Moedas" min="1">
      <button class="p" style="margin-top:6px; width:100%;" onclick="sendGift()">🎁 Enviar Presente</button>
    </div>
  `;
}

function depositSavings() {
  const amt = parseInt($('#bank-amount').value);
  if (!amt || amt <= 0) return toast('Insira um valor válido!');
  if (!isOwner && myProfile.coins < amt) return toast('Moedas insuficientes na carteira!');

  if (!isOwner) {
    myProfile.coins -= amt;
    myProfile.savings += amt;
    saveProfileToGlobal();
  }
  toast(`🪙 Depositado ${amt} moedas na Poupança!`);
  render();
}

function withdrawSavings() {
  const amt = parseInt($('#bank-amount').value);
  if (!amt || amt <= 0) return toast('Insira um valor válido!');
  if (!isOwner && myProfile.savings < amt) return toast('Saldo insuficiente na Poupança!');

  if (!isOwner) {
    myProfile.savings -= amt;
    myProfile.coins += amt;
    saveProfileToGlobal();
  }
  toast(`🪙 Sacado ${amt} moedas para a carteira!`);
  render();
}

function sendGift() {
  const targetId = $('#gift-target').value;
  const amt = parseInt($('#gift-amount').value);
  if (!targetId) return toast('Selecione um destinatário!');
  if (!amt || amt <= 0) return toast('Insira um valor válido!');

  if (!isOwner) {
    myProfile.coins -= amt;
    saveProfileToGlobal();
  }
  toast(`🎁 Presente de ${amt} moedas enviado com sucesso!`);
  render();
}

const EMOJIS = ['👑','⚡','🔥','💎','🚀','⭐','🌟','🏆','🎯','🎨','🔮','🛡️','🗡️','🐉','🐯','🦅','🍀','💎','🎩','🎸','🍕','🍔','⚡','🛸','💡','🪐','🎲','🍉','💎','🍩'];
const ADJ = ['Lendário','Supremo','Místico','Cósmico','Galáctico','Elite','Imperial','Divino','Solar','Lunar','Titanium','Cyber','Fênix','Soberano','Alpha','Quantum','Vanguard','Stellar','Neon','Prime'];
const TYPE = ['Coroa','Escudo','Espada','Orbe','Símbolo','Manto','Anel','Cristal','Aura','Emblema'];

let SHOP_ITEMS = [];
for (let i = 1; i <= 100; i++) {
  let badge = EMOJIS[(i - 1) % EMOJIS.length];
  let name = `${badge} ${TYPE[(i - 1) % TYPE.length]} ${ADJ[(i - 1) % ADJ.length]} #${i}`;

function shopView() {
  return `

      <p class="rules">Escolha entre mais de 100 itens exclusivos. Se faltar saldo na carteira, o sistema transfere automaticamente da sua <b>Poupança Complete</b>!</p>
      <div style="font-size:13px; color:var(--gold); margin-bottom:10px;">Saldo Disponível (Carteira + Poupança): 🪙 ${isOwner ? '∞' : (myProfile.coins + myProfile.savings)}</div>
    </div>

    ${SHOP_ITEMS.map(item => `
      <div class="card row" style="justify-content:space-between;">
        <div>
          <b style="font-size:16px;">${esc(item.name)}</b>

function buyShopItem(id, price, badge) {
  if (isOwner) {
    myProfile.badge = badge;
    saveProfileToGlobal();
    return toast('🎉 Item adquirido instantaneamente (Dono)!');
  }

  let totalAvailable = myProfile.coins + myProfile.savings;
  if (totalAvailable < price) {
    return toast('❌ Saldo insuficiente na Carteira e na Poupança!');
  }

  if (myProfile.coins < price) {
    let diff = price - myProfile.coins;
    myProfile.coins = 0;
    myProfile.savings -= diff;
  } else {
    myProfile.coins -= price;
  }

  myProfile.badge = badge;
  saveProfileToGlobal();
  renderHeader();
  render();
  toast('🎉 Compra realizada com sucesso! Saldo transferido e item aplicado.');
}

async function submitPost(kind) {
  const title = sanitize($('#p-title').value.trim());
  if (!title) return toast('Insira um título!');

  let content = $('#p-content') ? sanitize($('#p-content').value.trim()) : '';
  let options = [];

  if (kind === 'polls') {
    options = [sanitize($('#p-opt1').value.trim()), sanitize($('#p-opt2').value.trim())].filter(Boolean);
    if (options.length < 2) return toast('Insira 2 opções!');
  } else if (!content) {
    return toast('Preencha o conteúdo!');
  }

  const postObj = {
    title, content, options, votes: {}, by: uid,
    authorName: myProfile.name, authorBadge: myProfile.badge,
    ts: Date.now(), likes: []
  };

  if (db) await db.collection(kind).add(postObj);
  toast('🎉 Publicado globalmente!');
  if (!isOwner) {
    myProfile.coins += 10;
    saveProfileToGlobal();
    renderHeader();
  }
}

function renderContentList(kind) {
  const container = $('#content-list');
  if (!container) return;

  let items = dataList[kind] || [];
  if (searchQuery) {
    items = items.filter(x => (x.title + ' ' + (x.content || '') + ' ' + (x.authorName || '')).toLowerCase().includes(searchQuery.toLowerCase()));
  }

  if (!items.length) {
    container.innerHTML = '<div class="empty">📭 Nenhuma publicação encontrada.</div>';
    return;
  }

  container.innerHTML = items.map(x => {
    let body = '';
    if (kind === 'videos') {
      const ytMatch = x.content.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
      body = ytMatch ? `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen></iframe>` : `<a href="${esc(x.content)}" target="_blank" style="color:var(--ac)">🔗 ${esc(x.content)}</a>`;
    } else if (kind === 'games') {
      body = `<button class="p" onclick="playGame(this, '${x.id}')">▶ Jogar Jogo</button><div id="game-frame-${x.id}" style="margin-top:10px;"></div>`;
    } else if (kind === 'news') {
      body = `<p style="white-space:pre-wrap;">${esc(x.content)}</p>`;
    } else if (kind === 'polls') {
      const votes = x.votes || {}, totalVotes = Object.keys(votes).length;
      body = (x.options || []).map((opt, idx) => {
        const count = Object.values(votes).filter(v => v === idx).length;
        const pct = totalVotes ? Math.round((count / totalVotes) * 100) : 0;
        return `<button class="s" style="display:block; width:100%; text-align:left; margin:6px 0; padding:10px; position:relative; overflow:hidden;" onclick="votePoll('${x.id}', ${idx})"><span style="position:absolute; left:0; top:0; bottom:0; width:${pct}%; background:var(--ac); opacity:0.25;"></span><span style="position:relative; font-weight:bold;">${esc(opt)} — ${pct}% (${count} votos)</span></button>`;
      }).join('');
    }

    return `
      <div class="card">
        <div class="row" style="margin-bottom:8px;">
          <span class="av">${esc((x.authorName || 'U')[0].toUpperCase())}</span>
          <div>
            <b>${esc(x.authorBadge || '👤')} ${esc(x.authorName || 'Usuário')}</b>
            <div class="by">${timeAgo(x.ts)}</div>
          </div>
        </div>
        <h3 style="margin: 6px 0 10px; font-size:18px;">${esc(x.title)}</h3>
        ${body}
        <div class="row" style="margin-top: 12px; border-top: 1px solid var(--bd); padding-top: 8px;">
          <button class="s" onclick="likeItem('${kind}', '${x.id}')">❤️ ${(x.likes || []).length} Curtidas</button>
          ${(isOwner || x.by === uid) ? `<button class="s" style="color:#ef4444;" onclick="deleteItem('${kind}', '${x.id}')">🗑️ Remover</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function playGame(btn, id) {
  const item = dataList.games.find(g => g.id === id);
  if (!item) return;
  const container = document.getElementById(`game-frame-${id}`);
  if (container) {
    const iframe = document.createElement('iframe');
    iframe.className = 'g'; iframe.srcdoc = item.content;
    container.innerHTML = ''; container.appendChild(iframe); btn.style.display = 'none';
  }
}

async function likeItem(kind, id) {
  const item = dataList[kind].find(x => x.id === id);
  if (!item) return;
  const likes = item.likes || [];
  const updated = likes.includes(uid) ? likes.filter(u => u !== uid) : [...likes, uid];
  if (db) await db.collection(kind).doc(id).update({ likes: updated });
}

async function deleteItem(kind, id) {
  if (db) { await db.collection(kind).doc(id).delete(); toast('Item removido.'); }
}

async function votePoll(id, optIdx) {
  const poll = dataList.polls.find(p => p.id === id);
  if (!poll) return;
  const votes = poll.votes || {}; votes[uid] = optIdx;
  if (db) await db.collection('polls').doc(id).update({ votes });
}

function generateAIGame() {
  const input = $('#ai-game-prompt'), prompt = sanitize(input.value.trim());
  if (!prompt) return toast('Digite uma ideia!');
  toast('⏳ IA gerando jogo...');
  setTimeout(() => {
    const code = `<!DOCTYPE html><html><head><style>body{margin:0;background:#111;color:#fff;text-align:center;font-family:sans-serif;}canvas{background:#222;border:2px solid #7c53ff;margin-top:10px;}</style></head><body><h2>🎮 ${prompt}</h2><canvas id="c" width="360" height="200"></canvas><p>Pontos: <b id="s">0</b></p><script>const c=document.getElementById('c'),x=c.getContext('2d');let score=0,py=150,vy=0,ox=360;window.onclick=()=>{if(py>=150)vy=-8;};function loop(){vy+=0.4;py+=vy;if(py>150){py=150;vy=0;}ox-=3;if(ox<-20){ox=360;score+=10;document.getElementById('s').textContent=score;}x.clearRect(0,0,360,200);x.fillStyle='#7c53ff';x.fillRect(40,py,20,20);x.fillStyle='#ff6b35';x.fillRect(ox,150,20,20);requestAnimationFrame(loop);}loop();<\/script></body></html>`;
    dataList.aiMsgs.push({ role: 'ai', text: `Jogo "${prompt}" gerado com sucesso!`, code, gameTitle: prompt });
    drawAIMessages();
  }, 1000);
}

async function publishGeneratedGame(title) {
  const lastMsg = [...dataList.aiMsgs].reverse().find(m => m.code);
  if (!lastMsg) return;
  const postObj = { title: 'Jogo IA: ' + title, content: lastMsg.code, by: uid, authorName: myProfile.name, authorBadge: myProfile.badge, ts: Date.now(), likes: [] };
  if (db) await db.collection('games').add(postObj);
  toast('🎮 Jogo publicado com sucesso!');
  go('games');
}
